# =============================================================================
# DEV CONFIG - Local development entry point (4" S3 square panel)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../../common/assets/cover_art_placeholder.svg"
  name: "espdesktop-4inch-s3"
  friendly_name: "EspDesktop 4inch S3"
  espdesktop_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espdesktop_component_ref: "HEAD"

esp32:
  partitions: "../../common/device/partitions_16mb_card_images.csv"

# Keep multiple development displays independently addressable on the same
# network. The suffix is derived from the device MAC, so it remains stable
# across DHCP changes and firmware updates.
esphome:
  name_add_mac_suffix: true
  build_flags:
    - "-DESPDESKTOP_S3_DISPLAY_RESET_TEST"
  includes:
    - display_resync_test.h
  on_boot:
    # Register before the web server starts accepting requests.
    - priority: 250
      then:
        - lambda: espdesktop::register_display_resync_test();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espdesktop: !include packages.yaml

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/embedded/www.js"

button:
  - platform: template
    name: Resync S3 Display
    internal: true
    entity_category: diagnostic
    on_press:
      - lambda: id(my_display).resync_scanout();

  - platform: template
    name: Reset S3 LCD Controller
    internal: true
    entity_category: diagnostic
    on_press:
      - lambda: id(my_display).reset_lcd_controller();
