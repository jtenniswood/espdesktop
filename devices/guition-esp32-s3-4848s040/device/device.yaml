# =============================================================================
# DEVICE - Guition ESP32-S3-4848S040 hardware definition
# =============================================================================
# Pin assignments, peripherals, and platform config for the 4" square panel.
# Includes the ESP32-S3 SoC (native WiFi), MIPI RGB display, GT911
# capacitive touchscreen, and backlight PWM.
# =============================================================================

substitutions:
  espdesktop_component_url: "https://github.com/jtenniswood/espdesktop"
  espdesktop_component_ref: "main"
  mdi_font_file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"

# ---------------------------------------------------------------------------
# ESP32-S3 platform (16MB flash, ESP-IDF framework)
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    # stick to recommended version, currently 5.5.4, 55.03.39 with tool-esptoolpy 5.3.0. No issues
    #version: 5.5.2
    # pioarduino 55.03.38-1 pulls tool-esptoolpy 5.2.0, which can install
    # incompletely in ESPHome containers and then fail while creating .bin files.
    #platform_version: 55.03.37
    advanced:
      # The clock/cover-art display controller uses a deep ESPHome action chain.
      # Keep enough headroom for rapid presence-driven sleep/wake transitions;
      # the 8 KiB default can overflow loopTask on this profile.
      loop_task_stack_size: 16384
    sdkconfig_options:
      # The S3 display stack leaves little internal RAM for HTTPS OTA checks.
      # Allocate mbedTLS buffers from PSRAM so firmware downloads can connect.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Hardware AES uses internal-RAM DMA buffers. On this S3 the largest
      # internal block can fall below that size while display and Companion
      # sessions are active; at 240 MHz software AES has no speed penalty.
      CONFIG_MBEDTLS_HARDWARE_AES: "n"
      # Keep the ESP32 task watchdog long enough for display startup while
      # remaining compatible with ESPHome 2026.4 and newer.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # Keep WiFi startup inside the internal-RAM budget after the RGB display
      # and LVGL buffers are initialized.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "8"
      # The static RX pool of eight requires an RX BA window of at most 16.
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # Prefer PSRAM for ordinary allocations. The web UI and Companion run
      # together; retaining small allocations internally can leave no
      # contiguous space for network buffers. Keep a 32 KiB internal reserve
      # for DMA and cache-disabled operations.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "0"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # RGB bounce-buffer scan-out requires 64-byte data-cache lines. The
      # default 32-byte lines can desynchronise PSRAM reads from panel DMA and
      # leave the whole display vertically shifted until the next restart.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # The RGB driver already restarts after a genuine DMA underflow. Restarting
      # on every VSYNC can instead shift the framebuffer by one bounce-buffer block.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: "n"
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# ---------------------------------------------------------------------------
# External component
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: ${espdesktop_component_url}
      ref: ${espdesktop_component_ref}
      path: components
    components: [espdesktop, web_server_idf, artwork_image, mipi_rgb, companion, captive_portal]
    refresh: 1s

# A local, panel-hosted TLS WebSocket endpoint for the optional macOS Companion
# app. The panel never discovers or connects to the Mac; the Mac reconnects to
# this endpoint after the user starts pairing from the panel web setup page.
companion:
  id: mac_companion
  port: 8443

espdesktop:
  id: espdesktop_app
  panel_config:
    on_layout_changed:
      - script.execute: refresh_subpage_grid
    device_profile: ${device_slug}
    storage: card_images
    button_order: button_order
    button_on_color: button_on_color
    buttons:
      - config: button_1_config
        subpage_chunks: [subpage_1_config, subpage_1_config_ext, subpage_1_config_ext_2, subpage_1_config_ext_3]
      - config: button_2_config
        subpage_chunks: [subpage_2_config, subpage_2_config_ext, subpage_2_config_ext_2, subpage_2_config_ext_3]
      - config: button_3_config
        subpage_chunks: [subpage_3_config, subpage_3_config_ext, subpage_3_config_ext_2, subpage_3_config_ext_3]
      - config: button_4_config
        subpage_chunks: [subpage_4_config, subpage_4_config_ext, subpage_4_config_ext_2, subpage_4_config_ext_3]
      - config: button_5_config
        subpage_chunks: [subpage_5_config, subpage_5_config_ext, subpage_5_config_ext_2, subpage_5_config_ext_3]
      - config: button_6_config
        subpage_chunks: [subpage_6_config, subpage_6_config_ext, subpage_6_config_ext_2, subpage_6_config_ext_3]
      - config: button_7_config
        subpage_chunks: [subpage_7_config, subpage_7_config_ext, subpage_7_config_ext_2, subpage_7_config_ext_3]
      - config: button_8_config
        subpage_chunks: [subpage_8_config, subpage_8_config_ext, subpage_8_config_ext_2, subpage_8_config_ext_3]
      - config: button_9_config
        subpage_chunks: [subpage_9_config, subpage_9_config_ext, subpage_9_config_ext_2, subpage_9_config_ext_3]
# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
# ESP32-S3 with octal PSRAM and MIPI RGB display fails to reinitialize
# peripherals after a software reset. A brief deep sleep forces a full
# hardware reset on wake, equivalent to a power cycle. The on_boot
# handler catches USB-triggered and software-triggered resets (the
# latter fired by the "Apply Configuration" restart button); the OTA
# on_end hook catches wireless updates.
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-DESPDESKTOP_MAX_GRID_SLOTS=9"
    - "-DESPDESKTOP_IMAGE_CARD_MAX_CONTEXTS=2"
    - "-DESPDESKTOP_LOW_HEAP_MEDIA_CONTROL=1"
    # Keep C++ literals close to their functions on the S3 firmware image;
    # the modal code is large enough to otherwise trip Xtensa l32r range limits.
    - "-mtext-section-literals"
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            auto reason = esp_reset_reason();
            if (reason == ESP_RST_SW) {
              esp_ota_img_states_t ota_state;
              const esp_partition_t *running = esp_ota_get_running_partition();
              if (running != nullptr &&
                  esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
                  ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
                ESP_LOGI("s3_reset", "Marking OTA image valid before hardware-reset workaround");
                id(s3_4848s040_safe_mode).mark_successful();
                global_preferences->sync();
                esp_sleep_enable_timer_wakeup(100000);
                esp_deep_sleep_start();
                return;
              }
            }
            if (reason == ESP_RST_USB || reason == ESP_RST_SW) {
              esp_sleep_enable_timer_wakeup(100000);
              esp_deep_sleep_start();
            }
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation
        - script.execute: clock_bar_apply

# ---------------------------------------------------------------------------
# PSRAM (video frame buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
        - lambda: |-
            esp_sleep_enable_timer_wakeup(100000);
            esp_deep_sleep_start();
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
        - lambda: |-
            esp_sleep_enable_timer_wakeup(100000);
            esp_deep_sleep_start();
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: s3_4848s040_safe_mode
  boot_is_good_after: 10s

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# The 4848S040 USB-C port is exposed as UART0 through a USB-UART bridge.
# GPIO19/20 are used by the touchscreen/display path, so USB_SERIAL_JTAG
# stops working once the application starts.
logger:
  hardware_uart: UART0

wifi:
  use_psram: true

# ---------------------------------------------------------------------------
# Backlight (LEDC PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO38
    id: gpio_backlight_pwm
    # The 4848S040 backlight driver needs a low PWM rate; high rates make
    # brightness levels below roughly 85% appear off on some boards. Keep the
    # pulses long, but avoid the more visible shimmer seen at 100Hz.
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on: !include ../../../common/device/display_backlight_on.yaml
    on_turn_off:
      then:
        - script.execute: display_backlight_handle_off
    on_state:
      then:
        - script.execute: display_backlight_handle_state

# ---------------------------------------------------------------------------
# Built-in relays (4848S040C relay variant)
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    name: Relay 1
    id: relay_1
    icon: mdi:electric-switch
    pin:
      number: GPIO40
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: Relay 2
    id: relay_2
    icon: mdi:electric-switch
    pin:
      number: GPIO2
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: Relay 3
    id: relay_3
    icon: mdi:electric-switch
    pin:
      number: GPIO1
    restore_mode: RESTORE_DEFAULT_OFF

# Momentary relay buttons for push-button/dimmer inputs.
button:
  - platform: template
    name: Relay 1 Push
    icon: mdi:gesture-tap-button
    on_press:
      then:
        - script.execute: relay_1_push

  - platform: template
    name: Relay 2 Push
    icon: mdi:gesture-tap-button
    on_press:
      then:
        - script.execute: relay_2_push

  - platform: template
    name: Relay 3 Push
    icon: mdi:gesture-tap-button
    on_press:
      then:
        - script.execute: relay_3_push

  - platform: template
    name: Backlight Sweep Test
    internal: true
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:brightness-percent
    web_server:
      sorting_group_id: sg_brightness
    on_press:
      then:
        - script.execute: s3_backlight_sweep_test

# ---------------------------------------------------------------------------
# SPI bus (used by MIPI RGB driver for ST7701S init sequence)
# ---------------------------------------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# ---------------------------------------------------------------------------
# I2C bus and touchscreen (GT911 capacitive, wakes screensaver on touch)
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    update_interval: 16ms
    # Use this panel's native coordinate range instead of the GT911's
    # auto-detected limits (candidate fix for shifted touches in #2123).
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    transform:
      mirror_x: false
      mirror_y: false
    on_touch:
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (4" 480x480 MIPI RGB panel)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_rgb
    model: GUITION-4848S040
    # Draw each LVGL refresh off-screen, then present the finished frame.
    double_buffered: true
    id: my_display
    # Start WiFi before the RGB panel allocates its frame buffers; otherwise the
    # WiFi driver can fail to claim enough internal RX buffers on fresh boots.
    setup_priority: 240
    # Keep the S3 RGB clock conservative while lifting the panel scan rate above
    # the visibly shimmery 8MHz setting. Higher clocks have caused screen shifts
    # and pixel breakup when WiFi, flash, and web traffic compete for PSRAM.
    pclk_frequency: 10MHz
    update_interval: never
    auto_clear_enabled: False
    # Keep the ST7701S panel init sequence on the non-mirrored path. The
    # ESPHome model default mirrors this panel, which causes visible scan-line
    # streaking on some 4848S040 units during LVGL updates.
    transform:
      mirror_x: false
      mirror_y: false

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  # Keep LVGL after WiFi and after the display driver.
  setup_priority: 230
  # Keep the buffer small so WiFi and runtime display resources retain PSRAM
  # headroom on the memory-constrained S3.
  buffer_size: 12%
  on_draw_start:
    - lambda: id(my_display).begin_frame();
  on_draw_end:
    - lambda: |-
        id(my_display).end_frame();
        #ifdef USE_COMPANION
        if (!id(my_display).is_failed()) companion_focus_frame_presented();
        #endif
  displays: my_display
  rotation: 180
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

script:
  - id: relay_1_push
    mode: restart
    then:
      - switch.turn_on: relay_1
      - delay: 200ms
      - switch.turn_off: relay_1

  - id: relay_2_push
    mode: restart
    then:
      - switch.turn_on: relay_2
      - delay: 200ms
      - switch.turn_off: relay_2

  - id: relay_3_push
    mode: restart
    then:
      - switch.turn_on: relay_3
      - delay: 200ms
      - switch.turn_off: relay_3

  - id: s3_backlight_sweep_test
    mode: restart
    then:
      - script.execute: screensaver_wake
      - script.wait: screensaver_wake
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 1.0
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.6
      - light.turn_on:
          id: display_backlight
          brightness: 60%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.3
      - light.turn_on:
          id: display_backlight
          brightness: 30%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.1
      - light.turn_on:
          id: display_backlight
          brightness: 10%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 1.0
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s

  - id: apply_screen_rotation
    then:
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 270
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 0
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 90
                      else:
                        - lvgl.display.set_rotation: 180

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "180"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: clock_bar_apply
