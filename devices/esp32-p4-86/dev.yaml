# =============================================================================
# DEV CONFIG - Local development entry point (Waveshare 4" P4 square panel)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  name: "espdesktop-p4-86"
  friendly_name: "EspDesktop P4-86"
  espdesktop_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espdesktop_component_ref: "HEAD"
  voice_wake_chime_file: "device/voice_wake_chime.flac"
  voice_timer_alert_file: "device/voice_timer_alert.flac"
  voice_stt_failure_chime_file: "device/voice_stt_failure_chime.flac"
  alarm_delay_entry_beep_file: "device/alarm_delay_entry_beep.flac"
  alarm_delay_exit_beep_file: "device/alarm_delay_exit_beep.flac"

esp32:
  partitions: "../../common/device/partitions_32mb_card_images.csv"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espdesktop: !include packages.yaml

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/embedded/www.js"
