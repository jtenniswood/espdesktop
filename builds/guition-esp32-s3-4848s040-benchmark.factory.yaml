# Instrumented reference for comparison with the async scan-out profile.
packages:
  factory: !include guition-esp32-s3-4848s040.factory.yaml

esp32:
  framework:
    sdkconfig_options:
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
      CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: "y"
      CONFIG_FREERTOS_RUN_TIME_COUNTER_TYPE_U64: "y"

esphome:
  build_flags:
    - "-DESPDESKTOP_S3_DISPLAY_BENCHMARK"
