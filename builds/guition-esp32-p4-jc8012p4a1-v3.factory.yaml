# Factory build for the JC8012P4A1 V3 production-silicon panel.
substitutions:
  firmware_version: "0.0.0"
  espdesktop_component_url: "file:///config"
  mdi_font_file: "/config/common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espdesktop_component_ref: "HEAD"

packages:
  core: !include guition-esp32-p4-jc8012p4a1-v3.yaml
  api_encryption: !include ../common/addon/api_encryption_dynamic.yaml

esphome:
  project:
    name: jtenniswood.espdesktop
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://jtenniswood/espdesktop/devices/guition-esp32-p4-jc8012p4a1-v3/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: https://jtenniswood.github.io/espdesktop/webserver/www.js?device=${device_slug}&v=${firmware_version}&ui=20260714-shared
  js_include: "../docs/public/webserver/embedded/www.js"
