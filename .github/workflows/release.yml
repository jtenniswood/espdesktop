name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to sign, notarize, and publish assets for
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and notarize EspDesktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Require a private draft release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "true"
          git tag --points-at HEAD | grep -Fx "${RELEASE_TAG}"

      - name: Verify protocol and application tests
        run: |
          python3 scripts/generate_companion.py --check
          swift test -Xswiftc -warnings-as-errors

      - name: Sign, notarize, staple, and verify the application
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            NOTARY_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required repository secret: ${required}" >&2
              exit 2
            fi
          done

          APP_VERSION="${RELEASE_TAG#v}"
          if [[ ! "${APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable semantic version: ${RELEASE_TAG}" >&2
            exit 2
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/espdesktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/espdesktop-developer-id.p12"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_KEY_ID}.p8"
          OUTPUT_DIR="${RUNNER_TEMP}/espdesktop-release"
          cleanup() {
            security delete-keychain "${KEYCHAIN_PATH}" >/dev/null 2>&1 || true
            rm -f "${CERT_PATH}" "${NOTARY_KEY_PATH}"
          }
          trap cleanup EXIT

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | base64 -D > "${CERT_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          MARKETING_VERSION="${APP_VERSION}" \
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
          CODE_SIGN_IDENTITY="${DEVELOPER_ID_APPLICATION}" \
          OUTPUT_DIR="${OUTPUT_DIR}" \
          Packaging/build_standalone.sh

          printf '%s' "${NOTARY_KEY_BASE64}" | base64 -D > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"
          NOTARY_KEY_PATH="${NOTARY_KEY_PATH}" \
          NOTARY_KEY_ID="${NOTARY_KEY_ID}" \
          NOTARY_ISSUER_ID="${NOTARY_ISSUER_ID}" \
          Packaging/notarize_standalone.sh "${OUTPUT_DIR}/EspControl Companion.app"

      - name: Upload notarized workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: espdesktop-release
          path: ${{ runner.temp }}/espdesktop-release/EspControl Companion-*
          if-no-files-found: error

      - name: Attach notarized assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          "${RUNNER_TEMP}/espdesktop-release/EspControl Companion-${RELEASE_TAG#v}.zip"
          "${RUNNER_TEMP}/espdesktop-release/EspControl Companion-${RELEASE_TAG#v}.dmg"
          --clobber
