name: macOS EspDesktop

on:
  pull_request:
    paths:
      - 'macos/EspDesktop/**'
      - 'product/v2/companion_capabilities.json'
      - 'compatibility/fixtures/companion_protocol_v3.json'
      - 'scripts/companion_protocol_codegen.py'
      - 'scripts/companion_release.py'
      - 'scripts/build.py'
      - 'scripts/generate_macos_icon.swift'
      - 'docs/reference/privacy.md'
      - 'docs/.vitepress/config.mts'
      - '.github/workflows/macos-espdesktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify EspDesktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify generated Companion contract
        run: python3 scripts/build.py companion --check

      - name: Run Companion tests
        run: swift test --package-path macos/EspDesktop -Xswiftc -warnings-as-errors

      - name: Build standalone EspDesktop app
        run: ALLOW_ADHOC=1 macos/EspDesktop/Packaging/build_standalone.sh

      - name: Verify standalone bundle metadata and entitlements
        run: |
          APP="macos/EspDesktop/.build/standalone/EspDesktop.app"
          test -f "${APP}/Contents/Info.plist"
          test -f "${APP}/Contents/Resources/AppIcon.icns"
          cmp common/assets/images/buy-me-a-coffee-button.png "${APP}/Contents/Resources/EspDesktop_Companion.bundle/buy-me-a-coffee-button.png"
          test -f "${APP}/Contents/Resources/PrivacyInfo.xcprivacy"
          plutil -lint "${APP}/Contents/Info.plist"
          plutil -lint "${APP}/Contents/Resources/PrivacyInfo.xcprivacy"
          ! codesign --display --entitlements - "${APP}" 2>&1 | grep -q 'com.apple.security.app-sandbox'
          codesign --display --entitlements - "${APP}" 2>&1 | grep -q 'com.apple.security.automation.apple-events'

      - name: Build EspDesktop disk image
        run: ALLOW_ADHOC=1 SKIP_FINDER_LAYOUT=1 macos/EspDesktop/Packaging/build_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: espdesktop-app
          path: macos/EspDesktop/.build/standalone/EspDesktop.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: espdesktop-disk-image
          path: macos/EspDesktop/.build/standalone/*.dmg
          if-no-files-found: error
