name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/webserver/**'
      - 'common/addon/time.yaml'
      - 'common/assets/**'
      - 'product/v2/**'
      - 'scripts/build_web_bundle.js'
      - 'scripts/web_source.js'
      - 'scripts/web_icon_names.js'
      - 'scripts/device_profiles.py'
      - 'devices/**'
      - 'product/release_devices.json'
      - 'scripts/release_devices.py'
      - 'scripts/check_public_firmware.py'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_docs_installer.js'
      - 'scripts/build.py'
      - 'scripts/prepare_release_web_assets.py'
      - 'scripts/prune_actions_cache.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ESPDESKTOP_NPM_CACHE_MAX_MB: 512
  OPTIONAL_STABLE_FIRMWARE_SLUGS: guition-esp32-p4-jc8012p4a1 guition-esp32-p4-jc8012p4a1-v2 guition-esp32-p4-jc8012p4a1-v3 guition-esp32-p4-jc4880p443-v3 guition-esp32-p4-jc1060p470-v2 esp32-p4-86

jobs:
  build-docs:
    name: Build Docs
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - run: git sparse-checkout disable || true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          NPM_CACHE="${HOME}/.cache/espdesktop-actions/npm"
          mkdir -p "${NPM_CACHE}"
          npm ci --prefer-offline --cache "${NPM_CACHE}"
          bash scripts/prune_actions_cache.sh "${NPM_CACHE}" "${ESPDESKTOP_NPM_CACHE_MAX_MB}" --strategy reset

      - name: Download verified release web assets
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: release-web-assets
          path: release-web-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Use verified release web assets
        if: github.event_name == 'workflow_run'
        run: |
          rm -rf docs/public/webserver
          cp -a release-web-assets docs/public/webserver

      - name: Prepare published release web assets
        id: prepare-web
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(gh release list --limit 30 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false) | .tagName][0] // ""')
          if [ -z "${RELEASE_TAG}" ]; then
            echo "No published release exists yet; building the editor with the retained compatibility bundle."
            npm run webserver:build
            exit 0
          fi
          LEGACY_WEB_DIR="${RUNNER_TEMP}/espdesktop-published-web"
          LEGACY_WEB_MANIFEST="${LEGACY_WEB_DIR}/web-assets.json"
          LEGACY_WEB_ARGS=()
          LEGACY_STABLE_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          mkdir -p "${LEGACY_WEB_DIR}"
          RELEASE_MANIFEST="${RUNNER_TEMP}/espdesktop-release-manifest.json"
          BUNDLE_PATH=""
          if [ -n "${LEGACY_STABLE_TAG}" ]; then
            gh release download "${LEGACY_STABLE_TAG}" --pattern release-manifest.json --output "${RELEASE_MANIFEST}"
            VERIFIED_BUNDLE_PATH=$(jq -er '.webBundle.path' "${RELEASE_MANIFEST}")
            if curl -fsSL "https://espdesktop.com/webserver/web-assets.json" -o "${LEGACY_WEB_MANIFEST}"; then
              BUNDLE_PATH=$(jq -r --arg tag "${LEGACY_STABLE_TAG}" '[.bundles[] | select(.firmwareVersions | index($tag))][0].path // empty' \
                "${LEGACY_WEB_MANIFEST}")
              if [ "${BUNDLE_PATH}" != "${VERIFIED_BUNDLE_PATH}" ]; then
                BUNDLE_PATH=""
              fi
            fi
          fi
          if [ -n "${LEGACY_STABLE_TAG}" ] && [ -z "${BUNDLE_PATH}" ]; then
            # Recover the verified editor if Pages is unavailable or serves a different bundle.
            RELEASE_SOURCE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${LEGACY_STABLE_TAG}" --jq .sha)
            RELEASE_RUN=$(gh run list --workflow release.yml --branch "${LEGACY_STABLE_TAG}" \
              --event workflow_dispatch --status success --json databaseId,headSha | \
              jq -r --arg source "${RELEASE_SOURCE}" '[.[] | select(.headSha == $source)][0].databaseId // empty')
            if [ -z "${RELEASE_RUN}" ]; then
              echo "::error::No successful Build Release run found for ${LEGACY_STABLE_TAG} at ${RELEASE_SOURCE}"
              exit 1
            fi
            RELEASE_WEB_DIR="${RUNNER_TEMP}/espdesktop-release-web"
            gh run download "${RELEASE_RUN}" --name release-web-assets --dir "${RELEASE_WEB_DIR}"
            PYTHONPATH=scripts python3 - "${RELEASE_MANIFEST}" "${RELEASE_WEB_DIR}" "${LEGACY_STABLE_TAG}" "${RELEASE_SOURCE}" <<'PY'
          import json
          import sys
          from pathlib import Path

          from firmware_release import current_web_bundle

          manifest_path, web_dir = map(Path, sys.argv[1:3])
          version, source = sys.argv[3:]
          release = json.loads(manifest_path.read_text(encoding="utf-8"))
          bundle = current_web_bundle(web_dir / "web-assets.json", web_dir)
          if (release["releaseVersion"] != version or release["sourceRevision"] != source
                  or release["webBundle"] != bundle or version not in bundle["firmwareVersions"]):
              raise SystemExit("Build Release editor does not match the published firmware manifest")
          print(f"Verified the hosted editor for {version}: {bundle['sha256']}")
          PY
            rm -rf docs/public/webserver
            cp -a "${RELEASE_WEB_DIR}" docs/public/webserver
            echo "used-release-artifact=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${BUNDLE_PATH}" ]; then
            if [[ ! "${BUNDLE_PATH}" =~ ^bundles/[0-9a-f]{64}/www\.js$ ]]; then
              echo "::error::Published web asset manifest has an invalid bundle path"
              exit 1
            fi
            mkdir -p "docs/public/webserver/$(dirname "${BUNDLE_PATH}")"
            curl -fsSL "https://espdesktop.com/webserver/${BUNDLE_PATH}" \
              -o "docs/public/webserver/${BUNDLE_PATH}"
            export ESPDESKTOP_LEGACY_WEB_MANIFEST="${LEGACY_WEB_MANIFEST}"
            export ESPDESKTOP_LEGACY_FIRMWARE_VERSION="${LEGACY_STABLE_TAG}"
            echo "ESPDESKTOP_LEGACY_WEB_MANIFEST=${LEGACY_WEB_MANIFEST}" >> "$GITHUB_ENV"
            echo "ESPDESKTOP_LEGACY_FIRMWARE_VERSION=${LEGACY_STABLE_TAG}" >> "$GITHUB_ENV"
            LEGACY_WEB_ARGS=(--legacy-web-manifest "${LEGACY_WEB_MANIFEST}")
          else
            echo "::warning::No stable release found; using the checked-in compatibility bundle."
          fi
          python3 scripts/prepare_release_web_assets.py --legacy-only "${RELEASE_TAG}"
          python3 scripts/build.py www --retain-current-bundle "${LEGACY_WEB_ARGS[@]}"
          python3 scripts/build.py www --check --retain-current-bundle "${LEGACY_WEB_ARGS[@]}"

      - name: Verify rebuilt hosted editor
        if: github.event_name != 'workflow_run' && steps.prepare-web.outputs.used-release-artifact != 'true'
        run: node scripts/check_web_asset_manifest.js --manifest-only

      - name: Stage the hosted editor loader
        run: node scripts/build_web_bundle.js --bridge-only > docs/public/webserver/www.js

      - name: Build docs
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run docs:build

      - name: Stage signed Mac update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          FEED_DIR="docs/.vitepress/dist/updates"
          mkdir -p "${FEED_DIR}"
          # Keep the newest stable Mac release for each protocol, even when firmware ships on its own.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -rs '[.[][] |
              select((.draft or .prerelease) | not) |
              .tag_name as $tag |
              select($tag | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")) |
              ($tag | ltrimstr("v")) as $version |
              select(any(.assets[]; .state == "uploaded" and .name == "EspDesktop-\($version).zip")) |
              .assets[] | select(.state == "uploaded" and (.name | test("^companion-appcast-v[0-9]+\\.xml$"))) |
              {tag: $tag, version: ($version | split(".") | map(tonumber)), feed: .name}
            ] | group_by(.feed)[] | max_by(.version) | [.tag, .feed] | @tsv' |
            while IFS=$'\t' read -r tag feed; do
              gh release download "$tag" --repo "${GITHUB_REPOSITORY}" \
                --pattern "$feed" --output "${FEED_DIR}/${feed}"
            done

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist

  download-firmware:
    name: Download Firmware
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_stable: ${{ steps.stable.outputs.has_stable }}
      has_firmware: ${{ steps.upload_firmware.outputs['artifact-id'] != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            devices/manifest.json
            product/release_devices.json
          sparse-checkout-cone-mode: false

      - name: Set device slugs
        run: |
          DEVICE_SLUGS=$(jq -r '.devices | join(" ")' product/release_devices.json)
          RECOVERY_SLUGS=$(jq -r --slurpfile release product/release_devices.json '[.devices | to_entries[] | select(.key as $slug | $release[0].devices | index($slug)) | select(.value.firmware.build.chip == "ESP32-P4") | .key] | join(" ")' devices/manifest.json)
          echo "DEVICE_SLUGS=${DEVICE_SLUGS}" >> "$GITHUB_ENV"
          echo "RECOVERY_SLUGS=${RECOVERY_SLUGS}" >> "$GITHUB_ENV"

      - name: Download firmware from stable releases
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30")
          STABLE_RELEASES_JSON=$(printf '%s' "${RELEASES_JSON}" | jq -c '[.[] | select((.draft | not) and (.prerelease | not))][0:5]')
          RELEASE_COUNT=$(printf '%s' "${STABLE_RELEASES_JSON}" | jq 'length')

          release_set_has_required_assets() {
            RELEASE_SET="$1"
            for SLUG in $DEVICE_SLUGS; do
              if echo " ${OPTIONAL_STABLE_FIRMWARE_SLUGS} " | grep -q " ${SLUG} "; then
                continue
              fi
              RELEASE=$(printf '%s' "${RELEASE_SET}" | jq -c \
                --arg manifest "${SLUG}.manifest.json" \
                --arg ota "${SLUG}.ota.bin" \
                'first(.[] | select(
                  (([.assets[]?.name] | index($manifest)) != null) and
                  (([.assets[]?.name] | index($ota)) != null)
                )) // empty')
              if [ -z "${RELEASE}" ]; then
                return 1
              fi
              if ! printf '%s' "${RELEASE}" | jq -e \
                --arg factory "${SLUG}.factory.bin" \
                '([.assets[]?.name] | index($factory)) != null' >/dev/null; then
                return 1
              fi
              if echo " ${RECOVERY_SLUGS} " | grep -q " ${SLUG} " && \
                ! printf '%s' "${RELEASE}" | jq -e \
                  --arg manifest "${SLUG}.recovery.manifest.json" \
                  --arg image "${SLUG}.recovery.bin" \
                  '(([.assets[]?.name] | index($manifest)) != null) and
                   (([.assets[]?.name] | index($image)) != null)' >/dev/null; then
                return 1
              fi
            done
            return 0
          }

          if [ "${RELEASE_COUNT}" -eq 0 ] || ! release_set_has_required_assets "${STABLE_RELEASES_JSON}"; then
            echo "::warning::No complete stable EspDesktop firmware release set found; deploying documentation without stable firmware"
            echo "has_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_stable=true" >> "$GITHUB_OUTPUT"

          download_asset() {
            RELEASE_JSON="$1"
            ASSET_NAME="$2"
            OUTPUT_PATH="$3"
            ASSET_URL=$(printf '%s' "${RELEASE_JSON}" | jq -r --arg name "${ASSET_NAME}" \
              '.assets[]? | select(.name == $name) | .url' | head -n 1)
            if [ -z "${ASSET_URL}" ]; then
              return 1
            fi
            mkdir -p "$(dirname "${OUTPUT_PATH}")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "${ASSET_URL}" \
              -o "${OUTPUT_PATH}"
          }

          ota_md5() {
            MANIFEST_PATH="$1"
            jq -r --arg path "$2" \
              'first((.builds // [])[]?.ota | select((.path // "") == $path) | (.md5 // "")) // ""' \
              "${MANIFEST_PATH}"
          }

          ota_release_url() {
            MANIFEST_PATH="$1"
            jq -r --arg path "$2" \
              'first((.builds // [])[]?.ota | select((.path // "") == $path) | (.release_url // "")) // ""' \
              "${MANIFEST_PATH}"
          }

          for SLUG in $DEVICE_SLUGS; do
            mkdir -p "firmware/${SLUG}"
            INDEX_ENTRIES=$(mktemp)
            HAVE_CURRENT=false
            : > "${INDEX_ENTRIES}"

            for IDX in $(seq 0 $((RELEASE_COUNT - 1))); do
              RELEASE_JSON=$(printf '%s' "${STABLE_RELEASES_JSON}" | jq -c ".[$IDX]")
              RELEASE_TAG=$(printf '%s' "${RELEASE_JSON}" | jq -r '.tag_name')
              RELEASE_HTML_URL=$(printf '%s' "${RELEASE_JSON}" | jq -r '.html_url')
              MANIFEST_TMP=$(mktemp)

              if ! download_asset "${RELEASE_JSON}" "${SLUG}.manifest.json" "${MANIFEST_TMP}"; then
                continue
              fi

              VERSION=$(jq -r '.version // ""' "${MANIFEST_TMP}")
              if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
                VERSION="${RELEASE_TAG}"
              fi
              VERSION_PATH=$(printf '%s' "${VERSION}" | sed 's/[^A-Za-z0-9._-]/_/g')

              if [ "${HAVE_CURRENT}" = false ]; then
                OTA_OUTPUT="firmware/${SLUG}/${SLUG}.ota.bin"
                OTA_INDEX_PATH="${SLUG}.ota.bin"
              else
                OTA_OUTPUT="firmware/${SLUG}/versions/${VERSION_PATH}/${SLUG}.ota.bin"
                OTA_INDEX_PATH="versions/${VERSION_PATH}/${SLUG}.ota.bin"
              fi

              if ! download_asset "${RELEASE_JSON}" "${SLUG}.ota.bin" "${OTA_OUTPUT}"; then
                continue
              fi

              if [ "${HAVE_CURRENT}" = false ]; then
                cp "${MANIFEST_TMP}" "firmware/${SLUG}/manifest.json"
                download_asset "${RELEASE_JSON}" "${SLUG}.factory.bin" "firmware/${SLUG}/${SLUG}.factory.bin" || true
                RECOVERY_MANIFEST="firmware/${SLUG}/recovery/manifest.json"
                if download_asset "${RELEASE_JSON}" "${SLUG}.recovery.manifest.json" "${RECOVERY_MANIFEST}"; then
                  if ! download_asset "${RELEASE_JSON}" "${SLUG}.recovery.bin" \
                    "firmware/${SLUG}/recovery/${SLUG}.recovery.bin"; then
                    echo "::error::${SLUG} recovery manifest exists but its recovery image is missing"
                    exit 1
                  fi
                fi
                HAVE_CURRENT=true
              fi

              OTA_MD5=$(ota_md5 "${MANIFEST_TMP}" "${SLUG}.ota.bin")
              if [ -z "${OTA_MD5}" ]; then
                echo "::warning::${SLUG} ${VERSION} manifest does not include an OTA md5"
                continue
              fi
              ENTRY_RELEASE_URL=$(ota_release_url "${MANIFEST_TMP}" "${SLUG}.ota.bin")
              if [ -z "${ENTRY_RELEASE_URL}" ]; then
                ENTRY_RELEASE_URL="${RELEASE_HTML_URL}"
              fi

              jq -n \
                --arg version "${VERSION}" \
                --arg release_url "${ENTRY_RELEASE_URL}" \
                --arg ota_path "${OTA_INDEX_PATH}" \
                --arg ota_md5 "${OTA_MD5}" \
                '{version:$version, release_url:$release_url, ota:{path:$ota_path, md5:$ota_md5}}' \
                >> "${INDEX_ENTRIES}"
            done

            if [ -s "${INDEX_ENTRIES}" ]; then
              jq -s --arg device "${SLUG}" '{device:$device, versions:.}' \
                "${INDEX_ENTRIES}" > "firmware/${SLUG}/versions.json"
            fi
          done

      - name: Download firmware from latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=20")

          asset_list_has_required_firmware() {
            ASSET_LIST="$1"
            for SLUG in $DEVICE_SLUGS; do
              if echo " ${OPTIONAL_STABLE_FIRMWARE_SLUGS} " | grep -q " ${SLUG} "; then
                continue
              fi
              if ! printf '%s' "${ASSET_LIST}" | jq -e \
                --arg manifest "${SLUG}.manifest.json" \
                --arg ota "${SLUG}.ota.bin" \
                '(([.[].name] | index($manifest)) != null) and (([.[].name] | index($ota)) != null)' \
                >/dev/null; then
                return 1
              fi
            done
            return 0
          }

          select_complete_beta_assets() {
            RELEASE_LIST="$1"
            CANDIDATE_COUNT=$(printf '%s' "${RELEASE_LIST}" | jq '[.[] | select((.draft | not) and .prerelease)] | length')
            if [ "${CANDIDATE_COUNT}" -eq 0 ]; then
              return 1
            fi
            for IDX in $(seq 0 $((CANDIDATE_COUNT - 1))); do
              CANDIDATE_ASSETS=$(printf '%s' "${RELEASE_LIST}" | jq -c \
                "[.[] | select((.draft | not) and .prerelease)][${IDX}].assets // []")
              if asset_list_has_required_firmware "${CANDIDATE_ASSETS}"; then
                printf '%s' "${CANDIDATE_ASSETS}"
                return 0
              fi
            done
            return 1
          }

          BETA_ASSETS=$(select_complete_beta_assets "${RELEASES_JSON}" || true)
          if [ -z "${BETA_ASSETS}" ]; then
            echo "::warning::No complete EspDesktop beta firmware release set found"
            BETA_ASSETS='[]'
          fi

          if [ "${BETA_ASSETS}" != "[]" ]; then
            download_beta_asset() {
              ASSET_NAME="$1"
              OUTPUT_PATH="$2"
              ASSET_URL=$(printf '%s' "${BETA_ASSETS}" | jq -r --arg name "${ASSET_NAME}" \
                '.[] | select(.name == $name) | .url' | head -n 1)
              if [ -z "${ASSET_URL}" ]; then
                return 0
              fi
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "${ASSET_URL}" \
                -o "${OUTPUT_PATH}"
            }

            for SLUG in $DEVICE_SLUGS; do
              (
                mkdir -p "firmware/${SLUG}/beta"
                download_beta_asset "${SLUG}.manifest.json" "firmware/${SLUG}/beta/manifest.json"
                download_beta_asset "${SLUG}.ota.bin" "firmware/${SLUG}/beta/${SLUG}.ota.bin"
              ) &
            done
            wait
          fi

      - name: Verify firmware assets
        if: steps.stable.outputs.has_stable == 'true'
        run: |
          MISSING=false
          for SLUG in $DEVICE_SLUGS; do
            MANIFEST="firmware/${SLUG}/manifest.json"
            if [ ! -f "$MANIFEST" ]; then
              if echo " ${OPTIONAL_STABLE_FIRMWARE_SLUGS} " | grep -q " ${SLUG} "; then
                echo "::warning::No firmware manifest found for ${SLUG} yet — install button will work after the first release asset is published"
              else
                echo "::error::No firmware manifest found for ${SLUG} — install page will be non-functional"
                MISSING=true
              fi
            fi
          done
          if [ "$MISSING" = true ]; then exit 1; fi

      - name: Upload firmware artifact
        id: upload_firmware
        if: hashFiles('firmware/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/

  deploy:
    name: Deploy to Pages
    needs: [build-docs, download-firmware]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            devices/manifest.json
            product/release_devices.json
            scripts/release_devices.py
            scripts/check_public_firmware.py
          sparse-checkout-cone-mode: false

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: dist

      - name: Download firmware artifact
        if: needs.download-firmware.outputs.has_firmware == 'true'
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/firmware

      - name: Remove retired integration metadata from public installer manifests
        if: needs.download-firmware.outputs.has_firmware == 'true'
        shell: bash
        run: |
          find dist/firmware -type f -name manifest.json -print0 |
            while IFS= read -r -d '' manifest; do
              jq 'del(.home_assistant_domain)' "$manifest" > "${manifest}.tmp"
              mv "${manifest}.tmp" "$manifest"
            done

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public firmware assets
        if: needs.download-firmware.outputs.has_stable == 'true'
        run: >-
          python3 scripts/check_public_firmware.py
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --manifest devices/manifest.json
          --optional-stable-slugs guition-esp32-p4-jc8012p4a1 guition-esp32-p4-jc8012p4a1-v2 guition-esp32-p4-jc8012p4a1-v3 guition-esp32-p4-jc4880p443-v3 guition-esp32-p4-jc1060p470-v2 esp32-p4-86
          --retries 5
          --delay 20
