name: Windows EspDesktop

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-espdesktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test Windows companion
        run: dotnet run --project windows/EspDesktop.Tests --configuration Release
      - name: Build Windows test app
        run: dotnet publish windows/EspDesktop --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output windows-test
      - uses: actions/upload-artifact@v7
        with:
          name: EspDesktop-iRacing-Windows-x64
          path: windows-test/EspDesktop.Windows.exe
          if-no-files-found: error
