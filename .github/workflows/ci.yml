name: CI

on:
  workflow_dispatch:
    inputs:
      browser_preflight:
        description: Run the complete release browser checks before tagging
        type: boolean
        default: false
      browser_runner:
        description: Browser preflight runner
        type: choice
        options: [self-hosted, ubuntu-latest]
        default: self-hosted
      browser_profile:
        description: Optional device slug for focused browser checks
        type: string
        default: ''
      browser_scope:
        description: Browser checks to run
        type: choice
        options: [full, standard-icons]
        default: full
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/nightly-firmware.yml'
      - '.github/workflows/pr-testing-guidance.yml'
      - '.github/workflows/release.yml'
      - '.github/pull_request_template.md'
      - 'AGENTS.md'
      - 'DEVELOPERS.md'
      - 'README.md'
      - 'compatibility/**'
      - 'common/**'
      - 'components/**'
      - 'dev-docs/**'
      - 'devices/**'
      - 'builds/**'
      - 'product/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ESPDESKTOP_NPM_CACHE_MAX_MB: 512

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.browser_preflight && github.run_id || 'normal' }}
  cancel-in-progress: true

jobs:
  pr-process:
    name: PR Process
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check PR documentation decision
        run: python3 scripts/check_pr_process.py

  sync-icons:
    name: Sync Generated Icons
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git sparse-checkout disable || true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          NPM_CACHE="${HOME}/.cache/espdesktop-actions/npm"
          mkdir -p "${NPM_CACHE}"
          npm ci --prefer-offline --cache "${NPM_CACHE}"
          bash scripts/prune_actions_cache.sh "${NPM_CACHE}" "${ESPDESKTOP_NPM_CACHE_MAX_MB}" --strategy reset

      - name: Generate icon outputs
        run: python3 scripts/build.py icons

      - name: Commit generated icon outputs
        id: commit
        run: |
          if git diff --quiet -- \
            common/assets/icon_glyphs.yaml \
            components/espdesktop/icons.h \
            src/webserver/entry.ts; then
            echo "Generated icon files are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            common/assets/icon_glyphs.yaml \
            components/espdesktop/icons.h \
            src/webserver/entry.ts
          git commit -m "Build generated icon files"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Generated Files
    needs: sync-icons
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.sync-icons.outputs.changed != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git sparse-checkout disable || true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pinned timezone data
        shell: bash
        run: |
          TZDATA_VENV="${RUNNER_TEMP}/espdesktop-tzdata"
          python3 -m venv "${TZDATA_VENV}"
          "${TZDATA_VENV}/bin/python" -m pip install --disable-pip-version-check "tzdata==2026.3"
          TZDATA_SITE="$("${TZDATA_VENV}/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          echo "PYTHONPATH=${TZDATA_SITE}${PYTHONPATH:+:${PYTHONPATH}}" >> "${GITHUB_ENV}"
          echo "PYTHONTZPATH=${TZDATA_SITE}/tzdata/zoneinfo" >> "${GITHUB_ENV}"

      - name: Ensure CMake is available
        shell: bash
        run: |
          if command -v cmake >/dev/null 2>&1; then
            CMAKE_VERSION="$(cmake --version | awk 'NR == 1 { print $3 }')"
            if python3 -c \
              'import sys; sys.exit(0 if tuple(map(int, sys.argv[1].split(".")[:2])) >= (3, 20) else 1)' \
              "${CMAKE_VERSION}"; then
              cmake --version
              exit 0
            fi
            echo "CMake ${CMAKE_VERSION} is older than the required version 3.20; installing the pinned fallback."
          fi

          CMAKE_VENV="${RUNNER_TEMP}/espdesktop-cmake"
          python3 -m venv "${CMAKE_VENV}"
          "${CMAKE_VENV}/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "cmake==3.31.10"
          echo "${CMAKE_VENV}/bin" >> "${GITHUB_PATH}"
          "${CMAKE_VENV}/bin/cmake" --version

      - name: Check MIPI RGB models against pinned ESPHome
        shell: bash
        run: |
          source .github/esphome.env
          MODEL_CHECK_VENV="${RUNNER_TEMP}/espdesktop-esphome-model-check"
          python3 -m venv "${MODEL_CHECK_VENV}"
          "${MODEL_CHECK_VENV}/bin/python" -m pip install \
            --disable-pip-version-check \
            "esphome==${ESPHOME_VERSION}"
          "${MODEL_CHECK_VENV}/bin/python" scripts/check_mipi_rgb_models.py
          # Firmware integration tests parse YAML using the pinned ESPHome environment.
          echo "${MODEL_CHECK_VENV}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          NPM_CACHE="${HOME}/.cache/espdesktop-actions/npm"
          mkdir -p "${NPM_CACHE}"
          npm ci --prefer-offline --cache "${NPM_CACHE}"
          bash scripts/prune_actions_cache.sh "${NPM_CACHE}" "${ESPDESKTOP_NPM_CACHE_MAX_MB}" --strategy reset

      - name: Run required check graph
        run: npm run check:ci -- --summary-json check-task-summary.json

      - name: Upload task graph summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-task-graph-summary
          path: check-task-summary.json
          if-no-files-found: warn

  docs:
    name: Build Docs
    needs: sync-icons
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.sync-icons.outputs.changed != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git sparse-checkout disable || true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          NPM_CACHE="${HOME}/.cache/espdesktop-actions/npm"
          mkdir -p "${NPM_CACHE}"
          npm ci --prefer-offline --cache "${NPM_CACHE}"
          bash scripts/prune_actions_cache.sh "${NPM_CACHE}" "${ESPDESKTOP_NPM_CACHE_MAX_MB}" --strategy reset

      - name: Build editor and docs
        run: |
          npm run webserver:build
          npm run docs:build

      - name: Install Chromium for installer checks
        run: npx playwright install --with-deps chromium

      - name: Check browser USB installer
        run: npm run docs:check-installer

  browser-preflight:
    name: Release Browser Preflight
    if: github.event_name == 'workflow_dispatch' && inputs.browser_preflight
    runs-on: ${{ inputs.browser_runner }}
    timeout-minutes: 45
    steps:
      - name: Prepare self-hosted workspace
        if: inputs.browser_runner == 'self-hosted'
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/"* "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"..?* 2>/dev/null ||
            sudo rm -rf "${GITHUB_WORKSPACE:?}/"* "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"..?*
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run release browser checks
        env:
          ESPDESKTOP_BROWSER_PROFILE: ${{ inputs.browser_profile }}
          ESPDESKTOP_STANDARD_ICON_SIZES_ONLY: ${{ inputs.browser_scope == 'standard-icons' && '1' || '' }}
        run: node scripts/check_web_browser_smoke.js
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-failures
          path: .cache/web-browser-smoke/
          if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    needs: [pr-process, validate, docs]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs passed
        run: |
          if [ "${{ needs.pr-process.result }}" != "success" ] ||
             [ "${{ needs.validate.result }}" != "success" ] ||
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::Required CI jobs did not pass."
            echo "PR Process: ${{ needs.pr-process.result }}"
            echo "Validate Generated Files: ${{ needs.validate.result }}"
            echo "Build Docs: ${{ needs.docs.result }}"
            exit 1
          fi
