# =============================================================================
# CORE INFRASTRUCTURE - Shared API, logging, web server, and restart button
# =============================================================================
# Included by each device's device.yaml via packages. Contains config that is
# identical across all hardware targets.
# =============================================================================

esphome:
  # Enable LVGL's bidirectional text algorithm so right-to-left scripts
  # (Hebrew, Arabic) render in visual order.
  build_flags:
    - "-DLV_USE_BIDI=1"
    - '-DESPDESKTOP_DEVICE_SLUG=\"${device_slug}\"'

logger:
  logs:
    light: WARN
    script: INFO

http_request:
  id: http_req
  timeout: 10s

web_server:
  port: 80
  version: 3
  include_internal: true
  js_url: https://jtenniswood.github.io/espdesktop/webserver/www.js?device=${device_slug}&v=${firmware_version}&ui=20260714-shared
  sorting_groups:
    - id: sg_button
      name: "Button Configuration"
      sorting_weight: 10
    - id: sg_display
      name: "Display Configuration"
      sorting_weight: 20
    - id: sg_brightness
      name: "Brightness"
      sorting_weight: 25
    - id: sg_screensaver
      name: "Screensaver"
      sorting_weight: 30
    - id: sg_connectivity
      name: "Connectivity"
      sorting_weight: 35
    - id: sg_firmware
      name: "Firmware"
      sorting_weight: 40
button:
  - platform: restart
    name: "${entity_display_restart}"

  - platform: template
    name: "Apply Configuration"
    internal: true
    disabled_by_default: true
    icon: mdi:restart
    entity_category: config
    on_press:
      then:
        # Flush web UI settings before rebooting; ESPHome normally batches
        # preference writes, so an immediate restart can otherwise lose them.
        - lambda: |-
            global_preferences->sync();
            App.safe_reboot();
