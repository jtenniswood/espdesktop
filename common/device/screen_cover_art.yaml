# =============================================================================
# COVER ART SCREENSAVER - Full-screen artwork overlay while media is playing
# =============================================================================

globals:
  - id: cover_art_media_playing
    type: bool
    initial_value: 'false'
  - id: cover_art_companion_source_active
    type: bool
    initial_value: 'true'
  - id: cover_art_delay_interrupted_by_transition
    type: bool
    initial_value: 'false'
  - id: cover_art_transition_generation
    type: uint32_t
    initial_value: '0'
  - id: cover_art_delay_generation
    type: uint32_t
    initial_value: '0'
  - id: cover_art_download_generation
    type: uint32_t
    initial_value: '0'
  - id: cover_art_runtime
    type: espdesktop::cover_art::RuntimeState
  - id: cover_art_home_assistant_base_url
    type: std::string
    initial_value: '""'
  - id: cover_art_home_assistant_client_address
    type: std::string
    initial_value: '""'
  - id: cover_art_title
    type: std::string
    initial_value: '""'
  - id: cover_art_artist
    type: std::string
    initial_value: '""'
  - id: cover_art_album
    type: std::string
    initial_value: '""'
  - id: cover_art_content_fingerprint
    type: uint64_t
    initial_value: '0'
  - id: cover_art_last_playback_state
    type: std::string
    initial_value: '""'
  - id: cover_art_media_duration
    type: float
    initial_value: '0.0'
  - id: cover_art_media_position
    type: float
    initial_value: '0.0'
  - id: cover_art_position_anchor
    type: float
    initial_value: '0.0'
  - id: cover_art_position_anchor_epoch
    type: int
    initial_value: '0'
  - id: cover_art_last_position_timestamp
    type: int
    initial_value: '0'
  - id: cover_art_last_progress_percent
    type: int
    initial_value: '-1'
  - id: cover_art_manual_pause_until_ms
    type: uint32_t
    initial_value: '0'
  - id: cover_art_layout_signature
    type: std::string
    initial_value: '""'

image:
  - platform: file
    file: "${cover_art_placeholder_file}"
    id: cover_art_placeholder
    type: RGB565
    byte_order: LITTLE_ENDIAN

artwork_image:
  - url: "https://placehold.co/${cover_art_decode_size}x${cover_art_decode_size}/111111/333333.jpg"
    id: cover_art_downloaded_image
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    placeholder: cover_art_placeholder
    resize: ${cover_art_decode_size}x${cover_art_decode_size}
    priority: COVER_ART
    buffer_size: 65536
    allow_insecure_local_urls: true
# Artwork bytes are pushed by the authenticated Mac Companion connection.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) && id(cover_art_media_playing);'
          then:
            - script.execute: cover_art_refresh_progress

lvgl:
  top_layer:
    widgets:
      - obj:
          id: cover_art_screensaver
          on_press:
            - script.execute: cover_art_pause_after_touch
            - script.wait: cover_art_pause_after_touch
            - script.execute: screensaver_wake
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - obj:
                id: cover_art_backdrop
                x: ${cover_art_x}
                y: ${cover_art_y}
                width: ${cover_art_size}px
                height: ${cover_art_size}px
                bg_color: 0x000000
                bg_opa: 100%
                radius: 0
                border_width: 0
                pad_all: 0
                scrollable: false
                scrollbar_mode: "off"
                clickable: false
            - image:
                id: cover_art_image_widget
                clickable: false
                x: ${cover_art_x}
                y: ${cover_art_y}
                width: ${cover_art_size}px
                height: ${cover_art_size}px
                src: cover_art_downloaded_image
                opa: 100%
                hidden: true
            - obj:
                id: cover_art_accent_overlay
                x: ${cover_art_accent_x}
                y: ${cover_art_accent_y}
                width: ${cover_art_accent_width}px
                height: ${cover_art_accent_height}px
                bg_color: 0x000000
                bg_opa: ${cover_art_accent_bg_opa}
                opa: ${cover_art_accent_opa}
                radius: 0
                border_width: 0
                pad_all: 0
                scrollable: false
                scrollbar_mode: "off"
                clickable: false
                hidden: true
            - obj:
                id: cover_art_track_panel
                x: ${cover_art_panel_x}
                y: ${cover_art_panel_y}
                width: ${cover_art_panel_width}px
                height: ${cover_art_panel_height}px
                bg_opa: 0%
                radius: 0
                border_width: 0
                pad_top: ${cover_art_panel_pad_top}
                pad_bottom: ${cover_art_panel_pad_bottom}
                pad_left: ${cover_art_panel_pad_left}
                pad_right: ${cover_art_panel_pad_right}
                scrollable: false
                scrollbar_mode: "off"
                clickable: false
                hidden: true
                layout:
                  type: flex
                  flex_flow: COLUMN
                  pad_row: ${cover_art_panel_pad_row}
                widgets:
                  - label:
                      id: cover_art_title_label
                      clickable: false
                      text: "—"
                      width: 100%
                      max_height: ${cover_art_title_max_height}px
                      long_mode: wrap
                      text_font: ${cover_art_title_font}
                      text_color: ${cover_art_text_color}
                      text_align: left
                      text_line_space: 0
                  - label:
                      id: cover_art_artist_label
                      clickable: false
                      text: ""
                      pad_top: ${cover_art_artist_pad_top}
                      width: 100%
                      long_mode: ${cover_art_artist_long_mode}
                      text_font: ${cover_art_artist_font}
                      text_color: ${cover_art_text_color}
                      text_opa: 80%
                      text_align: left
                      hidden: true
                  - label:
                      id: cover_art_time_label
                      clickable: false
                      text: "0:00  /  0:00"
                      pad_top: ${cover_art_time_pad_top}
                      width: 100%
                      text_font: ${cover_art_time_font}
                      text_color: ${cover_art_text_color}
                      text_opa: 80%
                      text_align: left
                      hidden: true
            - bar:
                id: cover_art_progress_bar
                clickable: false
                align: bottom_mid
                y: 0
                width: ${cover_art_progress_width}px
                height: ${cover_art_progress_height}px
                bg_color: 0x000000
                bg_opa: 50%
                radius: 0
                min_value: 0
                max_value: 100
                value: 0
                hidden: true
                indicator:
                  bg_color: ${cover_art_text_color}
                  radius: 0
script:
  - id: cover_art_resolve_home_assistant_base_url
    mode: restart
    then:
      - lambda: |-
          // Retained only for legacy image cards until their runtime is removed.
          id(espdesktop_app).home_assistant_endpoint().configure(
              id(home_assistant_artwork_endpoint_mode).current_option(),
              id(cover_art_home_assistant_artwork_protocol).current_option(),
              static_cast<uint16_t>(id(cover_art_home_assistant_artwork_port).state),
              id(cover_art_home_assistant_client_address),
              id(cover_art_home_assistant_artwork_host).state);
          id(cover_art_home_assistant_base_url) = id(espdesktop_app).home_assistant_endpoint().origin();

  - id: cover_art_handle_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return espdesktop::screensaver_pin().locked() ||
                     !id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) ||
                     lv_obj_has_flag(id(cover_art_screensaver), LV_OBJ_FLAG_HIDDEN) ||
                     id(screensaver_wake_touch_guard_active);
          then:
            - script.execute: cover_art_pause_after_touch
            - script.wait: cover_art_pause_after_touch
            - script.execute: screensaver_wake

  - id: cover_art_pause_after_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) ||
                     id(cover_art_manual_pause_until_ms) != 0;
          then:
            - script.stop: cover_art_delay_timer
            - lambda: |-
                float seconds = id(cover_art_delay).state;
                if (std::isnan(seconds) || seconds < 0.0f) seconds = 10.0f;
                if (seconds <= 0.0f) {
                  // A non-zero sentinel distinguishes a real cover-art dismissal
                  // from an ordinary touchscreen wake when return is immediate.
                  id(cover_art_manual_pause_until_ms) = 1;
                  ESP_LOGI("cover_art", "Cover art returns immediately after touch");
                  return;
                }
                if (seconds > 300.0f) seconds = 300.0f;
                uint32_t duration_ms = (uint32_t)(seconds * 1000.0f);
                id(cover_art_manual_pause_until_ms) = millis() + duration_ms;
                ESP_LOGI("cover_art", "Waiting %.0fs to show cover art again after touch", seconds);

  - id: cover_art_apply_responsive_layout
    mode: restart
    then:
      - lambda: |-
          int screen_w = lv_obj_get_width(id(cover_art_screensaver));
          int screen_h = lv_obj_get_height(id(cover_art_screensaver));
          if (screen_w <= 0) screen_w = ${screen_width};
          if (screen_h <= 0) screen_h = ${screen_height};
          const int art_size = ${cover_art_size};
          const std::string rotation = id(screen_rotation_select).current_option();
          const std::string signature = rotation + ":" + std::to_string(screen_w) + "x" +
              std::to_string(screen_h);
          if (signature == id(cover_art_layout_signature)) return;
          id(cover_art_layout_signature) = signature;

          auto set_fullscreen_size = [](int width, int height) {
            lv_obj_set_pos(id(cover_art_screensaver), 0, 0);
            lv_obj_set_size(id(cover_art_screensaver), width, height);
            lv_obj_set_pos(id(screensaver_wake_touch_guard), 0, 0);
            lv_obj_set_size(id(screensaver_wake_touch_guard), width, height);
            lv_obj_set_size(id(cover_art_progress_bar), width, ${cover_art_progress_height});
            lv_obj_align(id(cover_art_progress_bar), LV_ALIGN_BOTTOM_MID, 0, 0);
          };

          auto apply_split_layout = [](int screen_w, int screen_h,
                                       int art_x, int art_y, int art_size,
                                       int accent_x, int accent_y, int accent_w, int accent_h,
                                       int panel_x, int panel_y, int panel_w, int panel_h,
                                       int title_max_height) {
            lv_obj_set_pos(id(cover_art_screensaver), 0, 0);
            lv_obj_set_size(id(cover_art_screensaver), screen_w, screen_h);
            lv_obj_set_pos(id(screensaver_wake_touch_guard), 0, 0);
            lv_obj_set_size(id(screensaver_wake_touch_guard), screen_w, screen_h);
            lv_obj_set_size(id(cover_art_progress_bar), screen_w, ${cover_art_progress_height});
            lv_obj_align(id(cover_art_progress_bar), LV_ALIGN_BOTTOM_MID, 0, 0);
            lv_obj_set_pos(id(cover_art_backdrop), art_x, art_y);
            lv_obj_set_size(id(cover_art_backdrop), art_size, art_size);
            lv_obj_set_pos(id(cover_art_image_widget), art_x, art_y);
            lv_obj_set_size(id(cover_art_image_widget), art_size, art_size);
            lv_obj_set_pos(id(cover_art_accent_overlay), accent_x, accent_y);
            lv_obj_set_size(id(cover_art_accent_overlay), accent_w, accent_h);
            lv_obj_set_style_bg_opa(id(cover_art_accent_overlay), LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_opa(id(cover_art_accent_overlay), LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_pos(id(cover_art_track_panel), panel_x, panel_y);
            lv_obj_set_size(id(cover_art_track_panel), panel_w, panel_h);
            lv_obj_set_style_pad_top(id(cover_art_track_panel), 0, LV_PART_MAIN);
            lv_obj_set_style_pad_bottom(id(cover_art_track_panel), 0, LV_PART_MAIN);
            lv_obj_set_style_pad_left(id(cover_art_track_panel), 0, LV_PART_MAIN);
            lv_obj_set_style_pad_right(id(cover_art_track_panel), 0, LV_PART_MAIN);
            lv_obj_set_style_max_height(id(cover_art_title_label), title_max_height, LV_PART_MAIN);
          };

          auto set_art_image_geometry = [](int art_x, int art_y, int display_size) {
            const int source_size = ${cover_art_decode_size};
          #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
            lv_obj_set_pos(id(cover_art_image_widget), art_x, art_y);
            lv_obj_set_size(id(cover_art_image_widget), display_size, display_size);
            lv_image_set_inner_align(id(cover_art_image_widget), LV_IMAGE_ALIGN_COVER);
          #else
            uint16_t zoom = 256;
            if (source_size > 0 && display_size > 0) {
              int scaled = (display_size * 256 + source_size / 2) / source_size;
              if (scaled < 1) scaled = 1;
              if (scaled > 4096) scaled = 4096;
              zoom = static_cast<uint16_t>(scaled);
            }
            lv_img_set_pivot(id(cover_art_image_widget), 0, 0);
            lv_img_set_zoom(id(cover_art_image_widget), zoom);
            lv_obj_set_pos(id(cover_art_image_widget), art_x, art_y);
            lv_obj_set_size(id(cover_art_image_widget), source_size, source_size);
          #endif
          };

          const auto layout = espdesktop::cover_art::cover_art_layout(
              "${device_slug}", rotation,
              screen_w, screen_h, art_size, ${cover_art_title_max_height});
          set_fullscreen_size(layout.screen_width, layout.screen_height);
          apply_split_layout(layout.screen_width, layout.screen_height,
                             layout.art_x, layout.art_y, layout.art_size,
                             layout.accent_x, layout.accent_y, layout.accent_width, layout.accent_height,
                             layout.panel_x, layout.panel_y, layout.panel_width, layout.panel_height,
                             layout.title_max_height);
          set_art_image_geometry(layout.art_x, layout.art_y, layout.art_size);
          lv_obj_set_style_text_line_space(id(cover_art_title_label), ${cover_art_title_line_space}, LV_PART_MAIN);
          const auto playback = espdesktop::cover_art::playback_button_layout(
              layout, lv_font_get_line_height(lv_obj_get_style_text_font(id(cover_art_title_label), LV_PART_MAIN)),
              ${cover_art_title_line_space});
          // Keep the title line limit even when the square-screen control is disabled.
          lv_obj_set_style_max_height(id(cover_art_title_label), playback.title_max_height, LV_PART_MAIN);
          if (!layout.split) {
            lv_obj_set_style_bg_opa(id(cover_art_accent_overlay), LV_OPA_80, LV_PART_MAIN);
            lv_obj_set_style_opa(id(cover_art_accent_overlay), LV_OPA_80, LV_PART_MAIN);
            lv_obj_set_style_pad_top(id(cover_art_track_panel), layout.panel_padding, LV_PART_MAIN);
            lv_obj_set_style_pad_bottom(id(cover_art_track_panel),
                layout.panel_padding,
                LV_PART_MAIN);
            lv_obj_set_style_pad_left(id(cover_art_track_panel), layout.panel_padding, LV_PART_MAIN);
            lv_obj_set_style_pad_right(id(cover_art_track_panel), layout.panel_padding, LV_PART_MAIN);
          }
      - script.execute: cover_art_fit_artist_text

  - id: cover_art_fit_artist_text
    mode: restart
    then:
      - lambda: |-
          const auto layout = espdesktop::cover_art::cover_art_layout(
              "${device_slug}", id(screen_rotation_select).current_option(),
              ${screen_width}, ${screen_height}, ${cover_art_size}, ${cover_art_title_max_height});
          auto *artist = id(cover_art_artist_label);
          // Restore the configured behaviour when rotating out of this layout.
          lv_label_set_long_mode(artist, std::string("${cover_art_artist_long_mode}") == "dot"
              ? LV_LABEL_LONG_DOT : LV_LABEL_LONG_WRAP);
          lv_obj_set_style_max_height(artist, LV_COORD_MAX, LV_PART_MAIN);
          if (layout.title_max_lines == 0) return;
          lv_obj_update_layout(id(cover_art_track_panel));
          const int time_height = lv_obj_has_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN)
              ? 0 : lv_obj_get_height(id(cover_art_time_label));
          const int artist_height = espdesktop::cover_art::artist_height_budget(
              lv_obj_get_content_height(id(cover_art_track_panel)),
              lv_obj_get_height(id(cover_art_title_label)),
              lv_font_get_line_height(lv_obj_get_style_text_font(artist, LV_PART_MAIN)),
              ${cover_art_artist_pad_top}, time_height);
          lv_obj_set_style_max_height(artist, artist_height, LV_PART_MAIN);
          lv_label_set_long_mode(artist, LV_LABEL_LONG_DOT);

  - id: cover_art_extract_accent_color
    mode: queued
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_transition_generation) == 0 ||
                     !id(espdesktop_app).display().transition_is_current(
                         id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_extract_accent_color
      - lambda: |-
          auto *img = id(cover_art_downloaded_image);
          int img_w = img->get_width();
          int img_h = img->get_height();
          #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
          auto *dsc = img->get_lv_image_dsc();
          #else
          auto *dsc = img->get_lv_img_dsc();
          #endif
          const auto accent = espdesktop::cover_art::extract_accent_color_rgb565(
                  dsc ? dsc->data : nullptr, img_w, img_h, img->is_big_endian(),
                  img->get_content_offset_x(), img->get_content_offset_y(),
                  img->get_content_width(), img->get_content_height());
          const auto dark = espdesktop::cover_art::darken_accent_color(accent);
          lv_color_t dark_accent = dark.valid
              ? lv_color_make(dark.red, dark.green, dark.blue)
              : lv_color_make(0, 0, 0);
          ESP_LOGI("cover_art", "Artwork tint color: rgb(%d,%d,%d)",
                   dark.red, dark.green, dark.blue);
          lv_obj_set_style_bg_color(id(cover_art_backdrop), dark_accent, 0);
          lv_obj_set_style_bg_color(id(cover_art_accent_overlay), dark_accent, 0);

  - id: cover_art_clear_image_source
    mode: restart
    then:
      - lambda: |-
          #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
          ::lv_image_set_src(id(cover_art_image_widget), static_cast<const void *>(nullptr));
          #else
          ::lv_img_set_src(id(cover_art_image_widget), static_cast<const void *>(nullptr));
          #endif
          lv_obj_invalidate(id(cover_art_image_widget));

  - id: cover_art_show_black_screen
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_transition_generation) == 0 ||
                     !id(espdesktop_app).display().transition_is_current(
                         id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_show_black_screen
      - script.stop: cover_art_show_track_overlay
      - script.execute: cover_art_apply_responsive_layout
      - lambda: 'id(cover_art_runtime).image_available = false;'
      - lambda: |-
          lv_color_t black = lv_color_make(0, 0, 0);
          lv_obj_set_style_bg_color(id(cover_art_backdrop), black, 0);
          lv_obj_set_style_bg_color(id(cover_art_accent_overlay), black, 0);
      - script.execute: cover_art_clear_image_source
      - script.wait: cover_art_clear_image_source
      - lvgl.widget.hide: cover_art_image_widget
      - script.execute: cover_art_sync_track_text
      - lambda: |-
          lv_obj_set_style_text_line_space(id(cover_art_title_label), ${cover_art_title_line_space}, 0);
      - if:
          condition:
            lambda: |-
              return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) &&
                     id(cover_art_media_playing);
          then:
            - lvgl.widget.show: cover_art_accent_overlay
            - lvgl.widget.show: cover_art_track_panel
            - if:
                condition:
                  lambda: |-
                    return espdesktop::cover_art::progress_available(id(cover_art_media_duration));
                then:
                  - lvgl.widget.show: cover_art_progress_bar
                else:
                  - lvgl.widget.hide: cover_art_progress_bar
          else:
            - lvgl.widget.hide: cover_art_accent_overlay
            - lvgl.widget.hide: cover_art_track_panel
            - lvgl.widget.hide: cover_art_progress_bar
      - script.execute: cover_art_refresh_progress

  - id: cover_art_disable
    mode: restart
    then:
      - script.stop: cover_art_prepare_activation
      - script.stop: cover_art_delay_timer
      - script.stop: cover_art_show_track_overlay
      - script.execute: display_mode_clear_cover_art
      - script.wait: display_mode_clear_cover_art
      - globals.set:
          id: cover_art_media_playing
          value: 'false'
      - globals.set:
          id: cover_art_manual_pause_until_ms
          value: '0'
      - lambda: |-
          id(cover_art_runtime).clear_image();
          id(cover_art_title).clear();
          id(cover_art_artist).clear();
          id(cover_art_album).clear();
          id(cover_art_content_fingerprint) = 0;
          id(cover_art_last_playback_state).clear();
          id(cover_art_media_position) = 0.0f;
          id(cover_art_position_anchor) = 0.0f;
          id(cover_art_media_duration) = 0.0f;
          id(cover_art_position_anchor_epoch) = 0;
          id(cover_art_last_position_timestamp) = 0;
          id(cover_art_last_progress_percent) = -1;
          lv_bar_set_value(id(cover_art_progress_bar), 0, LV_ANIM_OFF);
          lv_label_set_text(id(cover_art_time_label), "0:00  /  0:00");
      - script.execute: cover_art_clear_image_source
      - script.wait: cover_art_clear_image_source
      - artwork_image.release: cover_art_downloaded_image
      - script.execute: cover_art_refresh_source
      - if:
          condition:
            lambda: 'return id(media_player_sleep_prevention_enabled).state;'
          then:
            - script.execute: screensaver_idle_check

  - id: cover_art_sync_track_text
    mode: restart
    then:
      - lvgl.label.update:
          id: cover_art_title_label
          text: !lambda |-
            const std::string title = espdesktop::media::normalize_media_display_text(id(cover_art_title));
            return title.empty() ? std::string("—") : normalize_display_text(title);
      - if:
          condition:
            lambda: 'return !espdesktop::media::normalize_media_display_text(id(cover_art_artist)).empty();'
          then:
            - lvgl.label.update:
                id: cover_art_artist_label
                text: !lambda |-
                  return normalize_display_text(espdesktop::media::normalize_media_display_text(id(cover_art_artist)));
            - lvgl.widget.show: cover_art_artist_label
          else:
            - lvgl.widget.hide: cover_art_artist_label
      - lambda: |-
          const bool progress_available = espdesktop::cover_art::progress_available(id(cover_art_media_duration));
          if (progress_available) {
            lv_obj_clear_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cover_art_progress_bar), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: cover_art_fit_artist_text

  - id: cover_art_refresh_progress
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_transition_generation) == 0 ||
                     !id(espdesktop_app).display().transition_is_current(
                         id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_refresh_progress
      - lambda: |-
          const bool time_was_hidden = lv_obj_has_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN);
          auto refit_artist_if_needed = [&]() {
            if (time_was_hidden != lv_obj_has_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN)) {
              id(cover_art_fit_artist_text).execute();
            }
          };
          float duration = id(cover_art_media_duration);
          float position = id(cover_art_media_position);
          auto now = id(panel_time).now();
          bool progress_playing = id(cover_art_media_playing);

          const bool progress_available =
            espdesktop::cover_art::progress_available(duration);
          if (!progress_available) {
            id(cover_art_media_duration) = 0.0f;
            id(cover_art_last_progress_percent) = -1;
            lv_bar_set_value(id(cover_art_progress_bar), 0, LV_ANIM_OFF);
            lv_label_set_text(id(cover_art_time_label), "0:00  /  0:00");
            lv_obj_add_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cover_art_progress_bar), LV_OBJ_FLAG_HIDDEN);
            refit_artist_if_needed();
            return;
          }

          if (id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART)) {
            lv_obj_clear_flag(id(cover_art_time_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_art_progress_bar), LV_OBJ_FLAG_HIDDEN);
          }

          if (progress_playing && now.is_valid()) {
            if (id(cover_art_position_anchor_epoch) != 0) {
              position = id(cover_art_position_anchor) +
                         (float)(now.timestamp - id(cover_art_position_anchor_epoch));
            } else if (id(cover_art_last_position_timestamp) != 0) {
              position = id(cover_art_media_position) +
                         (float)(now.timestamp - id(cover_art_last_position_timestamp));
            }
          }

          if (position < 0.0f) position = 0.0f;
          if (duration > 0.0f && position > duration) position = duration;
          id(cover_art_media_position) = position;
          if (now.is_valid() && id(cover_art_position_anchor_epoch) == 0) {
            id(cover_art_last_position_timestamp) = now.timestamp;
          }

          int elapsed = (int) position;
          if (elapsed < 0) elapsed = 0;
          int total = (int) duration;
          if (total < 0) total = 0;

          char label[32];
          if (duration >= 3600.0f) {
            snprintf(label, sizeof(label), "%d:%02d:%02d  /  %d:%02d:%02d",
                     elapsed / 3600, (elapsed % 3600) / 60, elapsed % 60,
                     total / 3600, (total % 3600) / 60, total % 60);
          } else {
            snprintf(label, sizeof(label), "%d:%02d  /  %d:%02d",
                     elapsed / 60, elapsed % 60, total / 60, total % 60);
          }
          lv_label_set_text(id(cover_art_time_label), label);

          int value = espdesktop::cover_art::progress_percent(position, duration);
          if (value != id(cover_art_last_progress_percent)) {
            id(cover_art_last_progress_percent) = value;
            lv_bar_set_value(id(cover_art_progress_bar), value, LV_ANIM_OFF);
          }
          refit_artist_if_needed();

  - id: cover_art_show_track_overlay
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_transition_generation) == 0 ||
                     !id(espdesktop_app).display().transition_is_current(
                         id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_show_track_overlay
      - if:
          condition:
            lambda: |-
              return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) &&
                     id(cover_art_media_playing);
          then:
            - script.execute: cover_art_sync_track_text
            - if:
                condition:
                  lambda: |-
                    return espdesktop::cover_art::progress_available(id(cover_art_media_duration));
                then:
                  - lvgl.widget.show: cover_art_progress_bar
                else:
                  - lvgl.widget.hide: cover_art_progress_bar
            - script.execute: cover_art_refresh_progress
            - if:
                condition:
                  lambda: |-
                    return espdesktop::cover_art::track_overlay_mode(
                        id(cover_art_media_playing),
                        false,
                        ${cover_art_square_overlay}, id(cover_art_runtime).image_available,
                        id(cover_art_track_overlay_duration).state) == espdesktop::cover_art::TrackOverlayMode::HIDDEN;
                then:
                  - lvgl.widget.hide: cover_art_accent_overlay
                  - lvgl.widget.hide: cover_art_track_panel
                else:
                  - lambda: |-
                      lv_obj_set_style_text_line_space(id(cover_art_title_label), ${cover_art_title_line_space}, 0);
                  - lvgl.widget.show: cover_art_accent_overlay
                  - lvgl.widget.show: cover_art_track_panel
                  - if:
                      condition:
                        lambda: |-
                          return espdesktop::cover_art::track_overlay_mode(
                              id(cover_art_media_playing),
                              false,
                              ${cover_art_square_overlay}, id(cover_art_runtime).image_available,
                              id(cover_art_track_overlay_duration).state) == espdesktop::cover_art::TrackOverlayMode::TIMED;
                      then:
                        - delay: !lambda 'return (uint32_t)(id(cover_art_track_overlay_duration).state * 1000);'
                        - if:
                            condition:
                              lambda: |-
                                return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::COVER_ART) &&
                                       id(cover_art_media_playing) &&
                                       id(cover_art_runtime).image_available &&
                                       ${cover_art_square_overlay} &&
                                       id(espdesktop_app).display().transition_is_current(
                                           id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART);
                            then:
                              - lvgl.widget.hide: cover_art_accent_overlay
                              - lvgl.widget.hide: cover_art_track_panel

  - id: show_cover_art_view
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return alarm_display_takeover_active();'
          then:
            - logger.log:
                level: DEBUG
                tag: cover_art
                format: "Skipping cover art while alarm display takeover is active"
            - script.stop: show_cover_art_view
      - if:
          condition:
            lambda: |-
              return id(cover_art_manual_pause_until_ms) != 0 &&
                     (int32_t)(id(cover_art_manual_pause_until_ms) - millis()) > 0;
          then:
            - script.execute: cover_art_start_delay
            - script.stop: show_cover_art_view
      - if:
          condition:
            lambda: |-
              auto now = id(panel_time).now();
              return screen_schedule_blocks_cover_art(
                       id(screen_schedule_trigger).state,
                       id(schedule_enabled).state,
                       id(schedule_presence_detected),
                       now.is_valid(),
                       now.is_valid() ? now.hour : 0,
                       (int) id(schedule_on_hour).state,
                       (int) id(schedule_off_hour).state,
                       id(screen_schedule_sensor_activation).current_option());
          then:
            - logger.log:
                level: DEBUG
                tag: cover_art
                format: "Skipping cover art while screen schedule night mode is active"
            - script.stop: show_cover_art_view
      - script.stop: cover_art_delay_timer
      - script.execute: display_mode_request_cover_art

  # Compatibility dismissal entry point. The controller request is the only
  # source of truth; the adapter performs the actual widget and image cleanup.
  - id: hide_cover_art_view
    mode: restart
    then:
      - script.stop: cover_art_delay_timer
      - script.execute: display_mode_clear_cover_art
      - script.wait: display_mode_clear_cover_art

  - id: display_mode_effect_cover_art
    mode: restart
    parameters:
      generation: int
    then:
      # Unwind the controller's nested action chain before layout/logging on
      # the S3's fixed loopTask stack. script.wait keeps completion ordered.
      - delay: 1ms
      - if:
          condition:
            lambda: |-
              return !id(espdesktop_app).display().transition_is_current(
                  static_cast<uint32_t>(generation), espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: display_mode_effect_cover_art
      - script.stop: cover_art_delay_timer
      - script.stop: backlight_fade_current_ui_to_black
      - script.stop: backlight_sleep_display_off
      - script.stop: screensaver_sleep_timer
      - script.stop: screensaver_sleep_sensor
      - script.stop: screensaver_sleep_display_off
      - script.stop: show_dimmed_view
      - script.stop: screensaver_dimmed_refresh_brightness
      - script.stop: show_clock_view
      - script.stop: clock_screensaver_refresh_brightness
      - script.execute: cover_art_sync_track_text
      - lambda: |-
          if (!id(espdesktop_app).display().transition_is_current(
                static_cast<uint32_t>(generation), espdesktop::DisplayMode::COVER_ART)) {
            id(display_mode_effect_cover_art).stop();
          }
          if (id(cover_art_runtime).loaded_url.empty()) {
            id(cover_art_runtime).image_available = false;
          }
      - lvgl.resume:
      - lambda: 'navigation_return_home(id(main_page)->obj);'
      - script.execute: hide_clock_view
      - script.execute: clock_bar_apply
      - lvgl.widget.hide: dim_screensaver_touch_guard
      - lvgl.widget.show: cover_art_screensaver
      - lambda: 'lv_obj_move_foreground(id(cover_art_screensaver));'
      - script.execute: backlight_apply_brightness
      - script.execute: cover_art_apply_responsive_layout
      - script.execute: cover_art_show_track_overlay
      - lambda: |-
          id(cover_art_prepare_activation).execute(
              generation, static_cast<int>(id(cover_art_content_fingerprint)));
      - script.wait: cover_art_prepare_activation
      - if:
          condition:
            lambda: 'return id(cover_art_runtime).image_available && ${cover_art_square_overlay};'
          then:
            - lvgl.widget.show: cover_art_image_widget
            - script.execute: cover_art_show_track_overlay
          else:
            - if:
                condition:
                  lambda: 'return id(cover_art_runtime).image_available;'
                then:
                  - lvgl.widget.show: cover_art_image_widget
                  - lambda: |-
                      lv_obj_set_style_text_line_space(id(cover_art_title_label), ${cover_art_title_line_space}, 0);
                  - lvgl.widget.show: cover_art_accent_overlay
                  - lvgl.widget.show: cover_art_track_panel
                else:
                  - script.execute: cover_art_show_black_screen
      - script.execute: cover_art_refresh_progress
  - id: cover_art_prepare_activation
    mode: restart
    parameters:
      generation: int
      source_generation: int
    then:
      - delay: 1ms
      - lambda: |-
          if (!id(espdesktop_app).display().transition_is_current(
                  static_cast<uint32_t>(generation), espdesktop::DisplayMode::COVER_ART) ||
              static_cast<uint32_t>(source_generation) != id(cover_art_content_fingerprint) ||
              !id(cover_art_screensaver_enabled).state || !id(cover_art_media_playing)) return;
          id(cover_art_request_artwork).execute();

  - id: cover_art_hide_effect
    mode: restart
    parameters:
      generation: int
      target_mode: int
    then:
      - if:
          condition:
            lambda: |-
              return !id(espdesktop_app).display().transition_is_current(
                  static_cast<uint32_t>(generation),
                  static_cast<espdesktop::DisplayMode>(target_mode));
          then:
            - script.stop: cover_art_hide_effect
      - script.stop: cover_art_prepare_activation
      - script.stop: cover_art_delay_timer
      - script.stop: cover_art_show_track_overlay
      - script.stop: cover_art_request_artwork
      - globals.set: { id: cover_art_transition_generation, value: '0' }
      - globals.set: { id: cover_art_download_generation, value: '0' }
      - lambda: |-
          id(cover_art_runtime).effective_download_url.clear();
          id(cover_art_runtime).active_download_source_url.clear();
      - lvgl.widget.hide: cover_art_screensaver
      - lvgl.widget.hide: cover_art_accent_overlay
      - lvgl.widget.hide: cover_art_track_panel
      - lvgl.widget.hide: cover_art_progress_bar
      - script.execute: clock_bar_apply

  - id: cover_art_start_delay
    mode: restart
    then:
      - globals.set:
          id: cover_art_delay_generation
          value: !lambda 'return id(espdesktop_app).display().generation();'
      - script.execute: cover_art_delay_timer

  - id: cover_art_delay_timer
    mode: restart
    then:
      - delay: !lambda |-
          float seconds = id(cover_art_delay).state;
          if (std::isnan(seconds)) seconds = 10.0f;
          if (seconds < 3.0f) seconds = 3.0f;
          if (seconds > 300.0f) seconds = 300.0f;
          uint32_t delay_ms = (uint32_t)(seconds * 1000.0f);
          int32_t pause_remaining_ms = id(cover_art_manual_pause_until_ms) != 0
              ? (int32_t)(id(cover_art_manual_pause_until_ms) - millis())
              : 0;
          if (pause_remaining_ms > 0) {
            delay_ms = (uint32_t) pause_remaining_ms;
            ESP_LOGI("cover_art", "Waiting %.0fs before showing cover art after touch",
                     delay_ms / 1000.0f);
          } else {
            ESP_LOGI("cover_art", "Waiting %.0fs before showing cover art", seconds);
          }
          return delay_ms;
      - if:
          condition:
            lambda: |-
              if (!id(espdesktop_app).display().generation_is_current(
                    id(cover_art_delay_generation))) return false;
              auto now = id(panel_time).now();
              bool schedule_blocks = screen_schedule_blocks_cover_art(
                  id(screen_schedule_trigger).state,
                  id(schedule_enabled).state,
                  id(schedule_presence_detected),
                  now.is_valid(),
                  now.is_valid() ? now.hour : 0,
                  (int) id(schedule_on_hour).state,
                  (int) id(schedule_off_hour).state,
                  id(screen_schedule_sensor_activation).current_option());
              return espdesktop::cover_art::display_allowed(
                       id(cover_art_screensaver_enabled).state,
                       id(cover_art_media_playing),
                       id(cover_art_companion_source_active),
                       true,
                       false,
                       false,
                       schedule_blocks,
                       alarm_display_takeover_active()) &&
                     (id(cover_art_manual_pause_until_ms) == 0 ||
                      (int32_t)(id(cover_art_manual_pause_until_ms) - millis()) <= 0);
          then:
            - globals.set:
                id: cover_art_manual_pause_until_ms
                value: '0'
            - script.execute: show_cover_art_view

  - id: cover_art_playback_refresh
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_screensaver_enabled).state &&
                     id(cover_art_media_playing) &&
                     (id(cover_art_companion_source_active));
          then:
            - script.execute: cover_art_playback_started
          else:
            - script.execute: cover_art_playback_stopped

  - id: cover_art_request_artwork
    mode: restart
    then:
      - lambda: |-
          if (!id(espdesktop_app).display().transition_is_current(
                  id(cover_art_transition_generation), espdesktop::DisplayMode::COVER_ART) ||
              !id(cover_art_screensaver_enabled).state || !id(cover_art_media_playing)) return;
          if (id(cover_art_downloaded_image)->has_image() && id(cover_art_runtime).image_available) {
            #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 4, 0)
            lv_image_set_src(id(cover_art_image_widget), id(cover_art_downloaded_image)->get_lv_image_dsc());
            #else
            lv_img_set_src(id(cover_art_image_widget), id(cover_art_downloaded_image)->get_lv_img_dsc());
            #endif
            lv_obj_clear_flag(id(cover_art_image_widget), LV_OBJ_FLAG_HIDDEN);
            id(cover_art_extract_accent_color).execute();
            id(cover_art_show_track_overlay).execute();
          } else {
            lv_obj_add_flag(id(cover_art_image_widget), LV_OBJ_FLAG_HIDDEN);
            id(cover_art_show_black_screen).execute();
          }
          #ifdef USE_COMPANION
          esphome::companion::request_companion_now_playing_artwork();
          #endif

  - id: cover_art_refresh_source
    mode: restart
    then:
      - lambda: |-
          #ifdef USE_COMPANION
          if (!id(cover_art_screensaver_enabled).state) return;
          auto &handler = companion_now_playing_handler();
          if (handler) handler(companion_runtime_snapshot().now_playing);
          esphome::companion::request_companion_now_playing_artwork();
          #endif

  - id: cover_art_playback_started
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(panel_time).now();
              bool schedule_blocks = screen_schedule_blocks_cover_art(
                  id(screen_schedule_trigger).state,
                  id(schedule_enabled).state,
                  id(schedule_presence_detected),
                  now.is_valid(),
                  now.is_valid() ? now.hour : 0,
                  (int) id(schedule_on_hour).state,
                  (int) id(schedule_off_hour).state,
                  id(screen_schedule_sensor_activation).current_option());
              return espdesktop::cover_art::feature_allowed(
                  id(cover_art_screensaver_enabled).state,
                  id(cover_art_companion_source_active),
                  true,
                  false,
                  false) &&
                  !schedule_blocks &&
                  !alarm_display_takeover_active();
          then:
            - if:
                condition:
                  lambda: |-
                    const bool clock_screensaver_active =
                        id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::CLOCK);
                    return !clock_screensaver_active &&
                           (id(media_player_sleep_prevention_enabled).state ||
                            (id(screensaver_mode).state != "timer" &&
                             id(screensaver_mode).state != "sensor") ||
                            !id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::ACTIVE));
                then:
                  - script.execute: cover_art_start_delay
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(espdesktop_app).display().target_mode_is(
                              espdesktop::DisplayMode::CLOCK);
                      then:
                        - script.execute: show_cover_art_view
                      else:
                        - script.execute: screensaver_idle_check

  - id: cover_art_delayed_playback_stopped
    mode: restart
    parameters:
      generation: int
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              return !id(espdesktop_app).display().generation_is_current(
                  static_cast<uint32_t>(generation));
          then:
            - if:
                condition:
                  lambda: |-
                    const std::string &state = id(cover_art_last_playback_state);
                    return state != "playing" && state != "buffering" && state != "paused";
                then:
                  # The obsolete callback may retire its old request from live
                  # playback state, but it must not change the current view.
                  # Reset the non-visual playback state first so later schedule
                  # and wake checks cannot reopen cover art for stopped media.
                  - globals.set:
                      id: cover_art_delay_interrupted_by_transition
                      value: 'false'
                  - globals.set:
                      id: cover_art_media_playing
                      value: 'false'
                  - globals.set:
                      id: cover_art_manual_pause_until_ms
                      value: '0'
                  - lambda: |-
                      id(cover_art_media_position) = 0.0f;
                      id(cover_art_position_anchor) = 0.0f;
                      id(cover_art_media_duration) = 0.0f;
                      id(cover_art_position_anchor_epoch) = 0;
                      id(cover_art_last_position_timestamp) = 0;
                      id(cover_art_last_progress_percent) = -1;
                  - script.execute: display_mode_clear_cover_art
                  - script.wait: display_mode_clear_cover_art
                  - script.execute: cover_art_release_stopped_artwork
            - script.stop: cover_art_delayed_playback_stopped
      - if:
          condition:
            lambda: |-
              const std::string &state = id(cover_art_last_playback_state);
              return state != "playing" && state != "buffering" && state != "paused";
          then:
            - script.execute: cover_art_playback_stopped

  - id: cover_art_playback_stopped
    mode: restart
    then:
      - script.stop: cover_art_delayed_playback_stopped
      - globals.set:
          id: cover_art_delay_interrupted_by_transition
          value: 'false'
      - globals.set:
          id: cover_art_media_playing
          value: 'false'
      - globals.set:
          id: cover_art_manual_pause_until_ms
          value: '0'
      - lambda: |-
          id(cover_art_media_position) = 0.0f;
          id(cover_art_position_anchor) = 0.0f;
          id(cover_art_media_duration) = 0.0f;
          id(cover_art_position_anchor_epoch) = 0;
          id(cover_art_last_position_timestamp) = 0;
          id(cover_art_last_progress_percent) = -1;
          lv_bar_set_value(id(cover_art_progress_bar), 0, LV_ANIM_OFF);
          lv_label_set_text(id(cover_art_time_label), "0:00  /  0:00");
      - script.execute: cover_art_return_home_after_playback

  - id: cover_art_release_stopped_artwork
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(cover_art_media_playing) ||
                     id(espdesktop_app).display().target_mode_is(
                       espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_release_stopped_artwork
      - script.stop: cover_art_prepare_activation
      - script.stop: cover_art_extract_accent_color
      - lambda: |-
          id(cover_art_runtime).clear_image();
      - script.execute: cover_art_clear_image_source
      - script.wait: cover_art_clear_image_source
      # Recheck ownership after the clearing script can yield to new artwork.
      - if:
          condition:
            lambda: |-
              return id(cover_art_media_playing) ||
                     id(espdesktop_app).display().target_mode_is(
                       espdesktop::DisplayMode::COVER_ART);
          then:
            - script.stop: cover_art_release_stopped_artwork
      - artwork_image.release: cover_art_downloaded_image

  - id: cover_art_return_home_after_playback
    mode: restart
    then:
      - script.execute: display_mode_clear_cover_art
      - script.wait: display_mode_clear_cover_art
      - script.execute: cover_art_release_stopped_artwork
      - script.wait: cover_art_release_stopped_artwork
      - if:
          condition:
            lambda: |-
              return id(espdesktop_app).display().target_mode_is(espdesktop::DisplayMode::ACTIVE);
          then:
            - script.execute: backlight_apply_brightness
            - script.execute: screensaver_idle_check
            - script.execute: home_screen_idle_check
