# =============================================================================
# SCREEN: BUTTON SETUP
# =============================================================================
# Shown when WiFi is connected but no button entity is configured.
# Directs the user to pair the Companion app or configure their buttons.
# =============================================================================

esphome:
  on_boot:
    - priority: -210
      then:
        - lambda: |-
            espdesktop::home_assistant::hooks().show_code = [](const std::string &code) {
              const auto &display = id(espdesktop_app).display();
              if (display.current_mode_is(espdesktop::DisplayMode::ACTIVE) &&
                  !display.takeover_active(espdesktop::DisplayTakeoverKind::CRITICAL))
                return device_show_home_assistant_pairing(code, id(${setup_body_font_id})->get_lv_font());
              return false;
            };
            device_pairing_style_button(id(button_setup_pair));
            register_theme_static_page(id(button_setup_page)->obj);
            companion_runtime_service().pairing_changed_handler = [] {
              id(button_setup_text_refresh).execute();
            };
            companion_runtime_service().show_pairing_code_handler = [] {
              id(button_setup_show_pairing_code).execute();
            };

lvgl:
  pages:
    - id: button_setup_page
      bg_color: $theme_background_color
      scrollable: false
      on_load:
        # The load trigger fires before LVGL makes the page active.
        - delay: 1ms
        - script.execute: button_setup_text_refresh
      on_unload:
        - lambda: |-
            if (device_pairing_ui().overlay) control_modal_close_nested_menu();
      widgets:
        - obj:
            width: $screen_width
            height: $screen_height
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: true
            on_press:
              then:
                - script.execute: setup_screen_dim_cancel
                - script.execute:
                    id: backlight_note_internal_brightness
                    brightness: 0.9
                - light.turn_on:
                    id: display_backlight
                    brightness: 90%
                - script.execute: setup_screen_dim
            widgets:
              - obj:
                  align: center
                  width: $content_width
                  height: SIZE_CONTENT
                  bg_opa: 0%
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: $setup_pad_row
                  widgets:
                    - label:
                        text_font: $setup_icon_font_id
                        text: $icon_cog
                        text_color: $theme_text_primary_color
                        text_align: center
                    - label:
                        id: button_setup_title
                        text: ""
                        text_font: $setup_title_font_id
                        text_color: $theme_text_primary_color
                        width: $content_width
                        text_align: center
                    - label:
                        id: button_setup_instructions
                        text: ""
                        text_font: $setup_body_font_id
                        text_color: $theme_text_muted_color
                        width: $content_width
                        text_align: center
                    - button:
                        id: button_setup_pair
                        hidden: true
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        pad_top: 18
                        pad_bottom: 18
                        pad_left: 36
                        pad_right: 36
                        on_press:
                          - lambda: |-
                              consume_button_touch_press(id(button_setup_pair));
                              device_pairing_open(id(${setup_body_font_id})->get_lv_font(),
                                                  id(${setup_title_font_id})->get_lv_font());
                        widgets:
                          - label:
                              id: button_setup_pair_label
                              text: ""
                              text_font: $setup_body_font_id
                    - label:
                        id: setup_ip_label
                        text: "http://..."
                        text_font: $setup_title_font_id
                        text_color: $theme_text_primary_color
                        width: $content_width
                        text_align: center
                    - label:
                        id: setup_app_url_label
                        text: "espdesktop.com"
                        hidden: true
                        text_font: $setup_title_font_id
                        text_color: $theme_text_primary_color
                        width: $content_width
                        text_align: center

script:
  - id: button_setup_show_pairing_code
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              const auto &display = id(espdesktop_app).display();
              return !device_pairing_ui().overlay && !screen_lock_enabled() &&
                  !display.takeover_active(espdesktop::DisplayTakeoverKind::CRITICAL);
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(espdesktop_app).display().current_mode_is(espdesktop::DisplayMode::ACTIVE);
                then:
                  - script.execute: screensaver_wake
                  - script.wait: screensaver_wake
            - lambda: |-
                const auto &display = id(espdesktop_app).display();
                if (!display.current_mode_is(espdesktop::DisplayMode::ACTIVE) ||
                    !display.target_mode_is(espdesktop::DisplayMode::ACTIVE) ||
                    display.takeover_active(espdesktop::DisplayTakeoverKind::CRITICAL) ||
                    device_pairing_ui().overlay || screen_lock_enabled()) return;
                const auto pairing = device_pairing_snapshot();
                if (!companion_pairing_can_show_on_display(pairing)) return;
                if (pairing.paired && !companion_runtime_service().reset_and_begin_pairing) return;
                device_pairing_show(id(${setup_body_font_id})->get_lv_font(),
                                    id(${setup_title_font_id})->get_lv_font(), pairing.paired);

  - id: button_setup_text_refresh
    mode: restart
    then:
      - lambda: |-
          // Language and pairing callbacks can run during startup. Refresh the
          // setup widgets only once LVGL has loaded the setup page.
          if (!id(button_setup_title) || lv_scr_act() != id(button_setup_page)->obj) return;
          const auto pairing = companion_pairing_provider()
              ? companion_pairing_provider()() : CompanionPairingSnapshot{};
          const bool needs_pairing = pairing.available && !pairing.paired;
          lv_label_set_text(id(button_setup_title), espdesktop_i18n("Setup"));
          lv_label_set_text(
              id(button_setup_instructions),
              needs_pairing ? espdesktop_i18n_key("download_companion_app_to_pair")
                            : espdesktop_i18n("Open your browser and\nconfigure your display"));
          lv_label_set_display_text(id(button_setup_pair_label), espdesktop_i18n("Pair"));
          lv_obj_set_flag(id(button_setup_pair), LV_OBJ_FLAG_HIDDEN,
                          !needs_pairing || !companion_runtime_service().begin_pairing);
          lv_obj_set_flag(id(setup_ip_label), LV_OBJ_FLAG_HIDDEN, needs_pairing);
          lv_obj_set_flag(id(setup_app_url_label), LV_OBJ_FLAG_HIDDEN, !needs_pairing);
