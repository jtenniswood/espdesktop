# This panel family can emit an OFF event while another view owns the display.
# Restore the current brightness before handling user-requested sleep.
then:
  - if:
      condition:
        lambda: |-
          return id(espdesktop_app).display().takeover_active(
                     espdesktop::DisplayTakeoverKind::INTERACTIVE) ||
                 id(espdesktop_app).display().takeover_active(
                     espdesktop::DisplayTakeoverKind::CRITICAL);
      then:
        - lambda: 'ESP_LOGD("backlight", "Restoring backlight after OFF event during display takeover");'
        - delay: 10ms
        - script.execute: backlight_apply_brightness
      else:
        - script.execute: display_backlight_handle_off
