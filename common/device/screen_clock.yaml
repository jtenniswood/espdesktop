# =============================================================================
# CLOCK SCREENSAVER - Full-screen clock overlay for idle display
# =============================================================================
# Black overlay with a large light-weight time label. Hidden by default; shown
# by backlight.yaml when the clock screensaver is enabled and the idle
# timeout fires. The label is positioned absolutely so the interval can
# drift it for burn-in prevention.
# =============================================================================

substitutions:
  clock_date_font: font_text_title

font:
  # The small glyph set and 2-bit anti-aliasing limit flash and RAM use.
  # The 4.3-inch P4 also reuses these digits for its landscape volume dial.
  - file: "gfonts://Roboto@Light"
    id: font_clock_display
    size: ${clock_font_size}
    bpp: 2
    glyphs: "0123456789:"

lvgl:
  top_layer:
    widgets:
      - obj:
          id: clock_screensaver
          x: 0
          y: 0
          width: 100%
          height: 100%
          # The saved clock text colour is independent of the theme. Keep its
          # content background black so the default white stays readable.
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: clock_label
                text_font: font_clock_display
                text_color: 0xFFFFFF
                text: "00:00"
            - label:
                id: clock_date_label
                text_font: ${clock_date_font}
                text_color: 0xFFFFFF
                text_align: CENTER
                text: ""
                hidden: true
      - obj:
          id: dim_screensaver_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          on_press:
            then:
              - script.execute: screensaver_wake
      - obj:
          id: screensaver_wake_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
