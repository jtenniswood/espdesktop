# Standalone page opened by swiping up from a grid view. The configuration is
# split into the same 255-byte chunks used by card-owned subpages.
text:
  - platform: template
    name: "Special Page Config"
    internal: true
    id: special_page_config
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255
    mode: text
    entity_category: config
    icon: "mdi:view-dashboard-outline"
    update_interval: never
    web_server:
      sorting_group_id: sg_button
    on_value:
      then:
        - script.execute: refresh_subpage_grid
