# =============================================================================
# CONFIG: DISPLAY & SCREENSAVER
# =============================================================================
# User-configurable temperature entity bindings and screensaver settings.
# All values persist across reboots and are editable via the webserver v3 UI.
# =============================================================================

globals:
  - id: screen_rotation_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  # Live copy of "the night schedule is the winning display request", kept in
  # step by display_mode_reconcile so the clock bar can show a moon without
  # recomputing the schedule itself.
  - id: clock_bar_night_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'

esphome:
  on_boot:
    # Publish panel settings before the grid starts. The native document
    # replaces these defaults when its saved generation is activated.
    - priority: -95
      then:
        - lambda: |-
            using Setting = espdesktop::panel_settings::ScalarSetting;
            auto &app = id(espdesktop_app);
            app.bind_panel_scalar(Setting::SCREEN_CLOCK_BAR, [](std::string_view value) {
              id(clock_bar_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_NETWORK_STATUS_ICON, [](std::string_view value) {
              id(network_status_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_CLOCK_BAR_NIGHT_MODE, [](std::string_view value) {
              id(clock_bar_night_mode_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_CLOCK_BAR_TIME, [](std::string_view value) {
              id(clock_bar_time_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_SUBPAGE_TITLE_BAR, [](std::string_view value) {
              id(subpage_title_bar_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_SUBPAGE_CHEVRON, [](std::string_view value) {
              id(subpage_chevrons_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::COMPANION_RETURN_HOME_ON_APP_SWITCH, [](std::string_view value) {
              id(companion_return_home_on_app_switch_enabled).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREEN_DEFAULT_ICON_SIZE, [](std::string_view value) {
              id(default_icon_size_select).publish_state(std::string(value));
            });
            app.bind_panel_scalar(Setting::SCREEN_CARD_CURVE, [](std::string_view value) {
              id(card_curve_select).publish_state(std::string(value));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_ACTION, [](std::string_view value) {
              id(screensaver_action).publish_state(std::string(value));
            });
            app.bind_panel_scalar(Setting::SCREENSAVER_MODE, [](std::string_view value) {
              id(screensaver_mode).publish_state(std::string(value));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_SHOW_DATE, [](std::string_view value) {
              id(clock_screensaver_show_date).publish_state(value == "1");
            });
            app.bind_panel_scalar(Setting::SCREENSAVER_TIMEOUT, [](std::string_view value) {
              id(screensaver_timeout).publish_state(std::atoi(std::string(value).c_str()));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_DIMMED_BRIGHTNESS, [](std::string_view value) {
              id(screensaver_dimmed_brightness).publish_state(std::atoi(std::string(value).c_str()));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_DAYTIME_DIMMED_BRIGHTNESS, [](std::string_view value) {
              id(screensaver_dimmed_brightness_day).publish_state(std::atoi(std::string(value).c_str()));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_NIGHTTIME_DIMMED_BRIGHTNESS, [](std::string_view value) {
              id(screensaver_dimmed_brightness_night).publish_state(std::atoi(std::string(value).c_str()));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_DAYTIME_CLOCK_BRIGHTNESS, [](std::string_view value) {
              id(clock_brightness_day).publish_state(std::atoi(std::string(value).c_str()));
            });
            app.bind_panel_scalar(Setting::SCREEN_SAVER_NIGHTTIME_CLOCK_BRIGHTNESS, [](std::string_view value) {
              id(clock_brightness_night).publish_state(std::atoi(std::string(value).c_str()));
            });
            espdesktop::set_card_icon_default_size(id(default_icon_size_select).current_option());
    # Template switches restore before the application core starts. Apply the
    # saved Companion navigation preference after startup, before grid setup.
    - priority: -96
      then:
        - lambda: |-
            if (espdesktop::active_espdesktop_app_core() != nullptr) {
              id(espdesktop_app).bind_app_subpage_preference_switch(*id(companion_auto_open_app_subpages_enabled));
              companion_set_return_home_on_app_switch(id(companion_return_home_on_app_switch_enabled).state);
            }
    - priority: -100
      then:
        - lambda: |-
            clock_bar_enable_settings_access(id(network_status_button));
            clock_bar_time_widget() = id(display_time);
            clock_bar_subpage_title_bar_enabled() = id(subpage_title_bar_enabled).state;
            clock_bar_companion_subpage_title_font() =
                lv_obj_get_style_text_font(id(display_time), LV_PART_MAIN);
            navigation_subpage_clock_bar_refresh() = []() {
              // Subpages use compact top spacing; returning home restores the
              // space required by the home screen's clock-bar setting.
              const ClockBarVisibility visibility = clock_bar_resolve_visibility(
                  id(clock_bar_enabled).state, id(main_page)->obj,
                  id(espdesktop_app).display().current_mode(),
                  id(espdesktop_app).display().target_schedule_inactive());
              clock_bar_set_button_grid_pages_pad_top(
                  id(main_page)->obj,
                  visibility.reserve_space ? ${main_page_pad_top} : ${main_page_compact_pad_top});
              navigation_refresh_subpage_label();
              // Status widgets share the page-dependent visibility policy too.
              // Apply the complete bar once per page change, not every timer tick.
              static lv_obj_t *last_clock_bar_page = nullptr;
              if (last_clock_bar_page != lv_scr_act()) {
                last_clock_bar_page = lv_scr_act();
                id(clock_bar_apply).execute();
                return;
              }
              clock_bar_set_widget_hidden(id(display_time),
                  !(clock_bar_should_show(id(clock_bar_enabled).state, id(main_page)->obj,
                      id(espdesktop_app).display().current_mode(),
                      id(espdesktop_app).display().target_schedule_inactive()) &&
                    id(clock_bar_time_enabled).state && lv_scr_act() == id(main_page)->obj &&
                    navigation_active_subpage_slot() == 0 && clock_bar_left_title().empty()));
              lv_obj_set_style_text_font(
                  id(temperatures),
                  !clock_bar_companion_subpage_label().empty() && clock_bar_modal_label().empty()
                      ? lv_obj_get_style_text_font(id(display_time), LV_PART_MAIN)
                      : clock_bar_left_title().empty()
                          ? id(${label_font})->get_lv_font()
                          : id(${media_title_font})->get_lv_font(),
                  LV_PART_MAIN);
              refresh_clock_bar_left_label(
                  id(main_page)->obj,
                  clock_bar_should_show(
                      id(clock_bar_enabled).state,
                      id(main_page)->obj,
                      id(espdesktop_app).display().current_mode(),
                      id(espdesktop_app).display().target_schedule_inactive()));
            };
    # Apply restored clock-bar visibility before subpages copy main-page padding.
    - priority: -150
      then:
        - script.execute: clock_bar_hide
        - script.execute: clock_bar_apply

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto &refresh_clock_bar = navigation_subpage_clock_bar_refresh();
          if (refresh_clock_bar) refresh_clock_bar();

script:
  - id: clock_bar_hide
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *temperature_labels[] = {
            id(temperatures),
          };
          hide_clock_bar_top_layer_widgets(temperature_labels, 1,
                                           id(display_time),
                                           id(network_status_button));
          clock_bar_set_widget_hidden(id(night_mode_status_icon), true);
          ${battery_status_hide_code}
          network_status_hide_modal();

  - id: clock_bar_apply
    mode: restart
    then:
      - lambda: |-
          register_theme_hud(id(temperatures), id(display_time),
                             id(network_status_icon_label),
                             id(night_mode_status_icon_label), nullptr,
                             ${theme_battery_hud_label});
          ClockBarVisibility visibility = clock_bar_resolve_visibility(
              id(clock_bar_enabled).state,
              id(main_page)->obj,
              id(espdesktop_app).display().target_mode(),
              id(espdesktop_app).display().target_schedule_inactive());
          const bool pairing_onboarding =
              lv_scr_act() == id(button_setup_page)->obj && id(button_order).state.empty();
          bool reserve_clock_bar_space = visibility.reserve_space;
          bool visible = visibility.visible || pairing_onboarding;
          bool show_time = visibility.visible && id(clock_bar_time_enabled).state &&
              lv_scr_act() == id(main_page)->obj && navigation_active_subpage_slot() == 0 &&
              clock_bar_left_title().empty();
          const bool show_network = pairing_onboarding ||
              (visibility.visible && id(network_status_enabled).state);
          bool show_night_mode = visibility.visible && id(clock_bar_night_mode_enabled).state &&
                                 id(clock_bar_night_mode_active);
          int clock_bar_screen_width = clock_bar_current_screen_width(${screen_width});
          int clock_bar_screen_height = clock_bar_current_screen_height(${screen_height});
          bool clock_bar_480_square =
              clock_bar_screen_width == 480 && clock_bar_screen_height == 480;
          bool clock_bar_device_480_square =
              ${screen_width} == 480 && ${screen_height} == 480;
          const bool companion_app_subpage = !clock_bar_companion_subpage_label().empty();
          const int clock_bar_reserved_height = ${main_page_pad_top};
          clock_bar_companion_subpage_title_font() =
              lv_obj_get_style_text_font(id(display_time), LV_PART_MAIN);
          int clock_bar_label_y = ${main_page_pad_top} / 5;
          int clock_bar_icon_y =
              (clock_bar_reserved_height - lv_obj_get_height(id(network_status_button))) / 2;
          if (clock_bar_icon_y < 0) clock_bar_icon_y = 0;
          clock_bar_left_icon_origin_x() =
              lv_obj_get_style_pad_left(id(main_page)->obj, LV_PART_MAIN);
          clock_bar_left_icon_origin_y() =
              std::max<int>(0, (clock_bar_reserved_height - CLOCK_BAR_COMPANION_ICON_SIZE) / 2);
          int clock_bar_item_width = ${clock_bar_item_gap};
          int clock_bar_right_x =
              clock_bar_480_square ? 4 : (clock_bar_screen_width >= 700 ? 8 : 6);
          lv_obj_t *temperature_labels[] = {
            id(temperatures),
          };
          set_clock_bar_left_labels(temperature_labels, 1);
          clock_bar_set_button_grid_pages_pad_top(
              id(main_page)->obj,
              reserve_clock_bar_space ? clock_bar_reserved_height : ${main_page_compact_pad_top});

          if (!visible) {
            hide_clock_bar_top_layer_widgets(temperature_labels, 1,
                                             id(display_time),
                                             id(network_status_button));
            clock_bar_set_widget_hidden(id(night_mode_status_icon), true);
            ${battery_status_hide_code}
            network_status_hide_modal();
            return;
          }

          // Wi-Fi remains the rightmost Settings shortcut. Other status icons
          // pack to its left, away from the home clock and subpage titles.
          ClockBarRightIcons clock_bar_right_icons =
              clock_bar_right_icons_begin(clock_bar_right_x, 8);
          if (show_network) {
            int network_box = lv_obj_get_width(id(network_status_button));
            clock_bar_right_icons_seed(
                clock_bar_right_icons,
                network_box,
                clock_bar_glyph_width(id(network_status_icon_label), network_box));
          }

          apply_clock_bar_fixed_layout(
              id(temperatures),
              id(display_time),
              id(network_status_button),
              visibility.visible && !clock_bar_left_title().empty(),
              show_time,
              show_network,
              clock_bar_screen_width >= 700 ? 8 : 6,
              clock_bar_label_y,
              clock_bar_right_x,
              clock_bar_icon_y,
              ${clock_bar_item_gap});
          lv_obj_set_style_text_font(
              id(temperatures),
              companion_app_subpage && clock_bar_modal_label().empty()
                  ? lv_obj_get_style_text_font(id(display_time), LV_PART_MAIN)
                  : clock_bar_left_title().empty()
                      ? id(${label_font})->get_lv_font()
                      : id(${media_title_font})->get_lv_font(),
              LV_PART_MAIN);

          if (show_time) {
            lv_obj_clear_flag(id(display_time), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(display_time), LV_OBJ_FLAG_HIDDEN);
          }
          if (show_network) {
            lv_obj_clear_flag(id(network_status_button), LV_OBJ_FLAG_HIDDEN);
            id(network_status_refresh).execute();
          } else {
            lv_obj_add_flag(id(network_status_button), LV_OBJ_FLAG_HIDDEN);
            network_status_hide_modal();
          }
          ${battery_status_apply_code}
          if (show_night_mode) {
            const int night_mode_box = lv_obj_get_width(id(night_mode_status_icon));
            const int night_mode_icon_x = clock_bar_right_icons_next_x(
                clock_bar_right_icons,
                night_mode_box,
                clock_bar_glyph_width(id(night_mode_status_icon_label),
                                      night_mode_box));
            lv_obj_align(id(night_mode_status_icon), LV_ALIGN_TOP_RIGHT,
                         night_mode_icon_x,
                         clock_bar_icon_y);
            lv_obj_clear_flag(id(night_mode_status_icon), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(night_mode_status_icon), LV_OBJ_FLAG_HIDDEN);
          }
          if (!visible) return;

          refresh_clock_bar_left_label(id(main_page)->obj,
                                    visible);

switch:
  - platform: template
    name: "${entity_screen_clock_bar}"
    internal: true
    id: clock_bar_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:clock-digital"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR, "0");'
    on_turn_on:
      - script.execute: clock_bar_apply
      - delay: 50ms
      - script.execute: refresh_button_grid
    on_turn_off:
      - script.execute: clock_bar_apply
      - delay: 50ms
      - script.execute: refresh_button_grid

  - platform: template
    name: "${entity_screen_network_status_icon}"
    internal: true
    id: network_status_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:wifi"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_NETWORK_STATUS_ICON, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_NETWORK_STATUS_ICON, "0");'
    on_turn_on:
      - script.execute: clock_bar_apply
    on_turn_off:
      - script.execute: clock_bar_apply

  - platform: template
    name: "${entity_screen_clock_bar_night_mode}"
    internal: true
    id: clock_bar_night_mode_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:weather-night"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR_NIGHT_MODE, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR_NIGHT_MODE, "0");'
    on_turn_on:
      - script.execute: clock_bar_apply
    on_turn_off:
      - script.execute: clock_bar_apply

  - platform: template
    name: "${entity_screen_clock_bar_time}"
    internal: true
    id: clock_bar_time_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:clock-time-four-outline"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR_TIME, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CLOCK_BAR_TIME, "0");'
    on_turn_on:
      - script.execute: clock_bar_apply
    on_turn_off:
      - script.execute: clock_bar_apply

  - platform: template
    name: "${entity_screen_subpage_title_bar}"
    internal: true
    id: subpage_title_bar_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:page-layout-header"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SUBPAGE_TITLE_BAR, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SUBPAGE_TITLE_BAR, "0");'
    on_state:
      - lambda: |-
          clock_bar_subpage_title_bar_enabled() = x;
          if (clock_bar_time_widget() != nullptr) id(clock_bar_apply).execute();

  - platform: template
    name: "${entity_companion_auto_open_app_subpages}"
    internal: true
    id: companion_auto_open_app_subpages_enabled
    optimistic: false
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: "mdi:application"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: |-
          if (espdesktop::active_espdesktop_app_core() == nullptr)
            id(companion_auto_open_app_subpages_enabled).publish_state(true);
    turn_off_action:
      - lambda: |-
          if (espdesktop::active_espdesktop_app_core() == nullptr)
            id(companion_auto_open_app_subpages_enabled).publish_state(false);

  - platform: template
    name: "${entity_companion_return_home_on_app_switch}"
    internal: true
    id: companion_return_home_on_app_switch_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:application"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::COMPANION_RETURN_HOME_ON_APP_SWITCH, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::COMPANION_RETURN_HOME_ON_APP_SWITCH, "0");'
    on_turn_on:
      - lambda: |-
          if (espdesktop::active_espdesktop_app_core() != nullptr)
            companion_set_return_home_on_app_switch(true);
    on_turn_off:
      - lambda: |-
          if (espdesktop::active_espdesktop_app_core() != nullptr)
            companion_set_return_home_on_app_switch(false);

  - platform: template
    name: "${entity_screen_subpage_chevron}"
    internal: true
    id: subpage_chevrons_enabled
    optimistic: false
    restore_mode: DISABLED
    entity_category: config
    icon: "mdi:chevron-right"
    web_server:
      sorting_group_id: sg_display
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SUBPAGE_CHEVRON, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SUBPAGE_CHEVRON, "0");'
    on_turn_on:
      - script.execute: refresh_button_grid
    on_turn_off:
      - script.execute: refresh_button_grid

  - platform: template
    name: "${entity_screen_saver_clock}"
    internal: true
    id: clock_screensaver_enabled
    optimistic: false
    restore_mode: DISABLED
    icon: "mdi:clock-outline"
    entity_category: config
    web_server:
      sorting_group_id: sg_screensaver
    turn_on_action:
      - lambda: |-
          id(espdesktop_app).edit_panel_scalar(
              espdesktop::panel_settings::ScalarSetting::SCREEN_SAVER_ACTION, "Clock");
    turn_off_action:
      - lambda: |-
          if (id(screensaver_action_clock)) {
            id(espdesktop_app).edit_panel_scalar(
                espdesktop::panel_settings::ScalarSetting::SCREEN_SAVER_ACTION, "Display Off");
          }

  - platform: template
    name: "${entity_screen_saver_show_date}"
    internal: true
    id: clock_screensaver_show_date
    optimistic: false
    restore_mode: DISABLED
    icon: "mdi:calendar"
    entity_category: config
    web_server:
      sorting_group_id: sg_screensaver
    turn_on_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SAVER_SHOW_DATE, "1");'
    turn_off_action:
      - lambda: 'id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_SAVER_SHOW_DATE, "0");'
    on_turn_on:
      - script.execute: clock_screensaver_update_time
    on_turn_off:
      - script.execute: clock_screensaver_update_time

select:
  - platform: template
    name: "${entity_screen_default_icon_size}"
    id: default_icon_size_select
    entity_category: config
    icon: "mdi:arrow-expand"
    optimistic: false
    restore_value: false
    initial_option: "Large"
    options:
      - "Small"
      - "Medium"
      - "Large"
    web_server:
      sorting_group_id: sg_display
    set_action:
      - lambda: |-
          id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_DEFAULT_ICON_SIZE,
              std::string_view(x.c_str(), x.size()));
    on_value:
      then:
        - lambda: 'espdesktop::set_card_icon_default_size(x);'
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

  - platform: template
    name: "${entity_screen_card_curve}"
    id: card_curve_select
    entity_category: config
    icon: "mdi:rounded-corner"
    optimistic: false
    restore_value: false
    initial_option: "Large"
    options:
      - "Small"
      - "Medium"
      - "Large"
    web_server:
      sorting_group_id: sg_display
    set_action:
      - lambda: |-
          id(espdesktop_app).edit_panel_scalar(espdesktop::panel_settings::ScalarSetting::SCREEN_CARD_CURVE,
              std::string_view(x.c_str(), x.size()));
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

  - platform: template
    name: "${entity_screen_saver_action}"
    internal: true
    id: screensaver_action
    entity_category: config
    icon: "mdi:monitor-shimmer"
    optimistic: true
    restore_value: true
    initial_option: "Display Off"
    options:
      - "Display Off"
      - "Screen Dimmed"
      - "Clock"
    web_server:
      sorting_group_id: sg_screensaver
    on_value:
      then:
        - lambda: |-
            std::string action = id(screensaver_action).current_option();
            id(screensaver_action_clock) = screensaver_action_clock_mode(action);
            id(screensaver_action_dimmed) = screensaver_action_dimmed_mode(action);
            id(clock_screensaver_enabled).publish_state(id(screensaver_action_clock));
        - if:
            condition:
              lambda: 'return screen_lock_enabled();'
            then:
              - script.execute: screensaver_companion_reconcile
        - if:
            condition:
              lambda: 'return id(espdesktop_app).display().current_mode_is(espdesktop::DisplayMode::ACTIVE) && lv_scr_act() == id(main_page)->obj;'
            then:
              - script.execute: screensaver_idle_check

